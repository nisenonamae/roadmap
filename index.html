<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--paper:#F6F3EC;--sheet:#FBF9F4;--ink:#26221E;--sub:#6E665C;--rule:#DCD5C7;--shu:#B5432F;--stage:#A33A2E;--wave:#2F4F8A;--ok:#3D7A55}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;font-size:15px;line-height:1.65;
  padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--wave);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:1.1rem 1rem 2rem}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding-bottom:.6rem;border-bottom:2px solid var(--ink);margin-bottom:1rem}
.head h1{margin:0;font-size:1.35rem;letter-spacing:.12em}
.head .date{color:var(--sub);font-size:.82rem;text-align:right}
.view[hidden]{display:none}
.empty{color:var(--sub);padding:1rem 0;font-size:.9rem}
.notice{background:var(--sheet);border-left:3px solid var(--shu);padding:.5rem .75rem;font-size:.86rem;margin:0 0 1rem}
.status{font-size:.84rem;color:var(--sub)}
.status.err{color:var(--shu)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:3px;padding:.4rem .9rem;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{padding:.2rem .6rem;font-size:.82rem}
.f label{display:block;font-size:.75rem;color:var(--sub);margin-bottom:.15rem}
.f input,.f select,textarea{width:100%;padding:.4rem .5rem;border:1px solid var(--rule);border-radius:3px;background:#fff}
textarea{min-height:7rem;line-height:1.6}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:.5rem .7rem}
/* 省の色 */
.mlist li{border-left:6px solid var(--mc,var(--rule));margin:.25rem 0;background:var(--sheet);border-radius:0 3px 3px 0}
.mlist button{padding:.7rem .7rem}
.mlist .mn{color:var(--mc)}
.mh{border-bottom-color:var(--mc,var(--ink))!important}
.mh h2{color:var(--mc)}
.purpose-box{border-left:4px solid var(--mc,var(--shu));background:var(--sheet);padding:.6rem .8rem;margin:.7rem 0;border-radius:0 3px 3px 0}
.purpose-box h3{margin:0 0 .3rem;font-size:.9rem;letter-spacing:.12em;color:var(--mc)}
.purpose-box p{margin:0;white-space:pre-wrap;font-size:.92rem}
.purpose-box .seed{font-size:.76rem;color:var(--sub);margin-top:.3rem}
.allcard{display:block;width:100%;text-align:left;border:none;cursor:pointer;background:var(--ink);color:var(--paper);
  border-radius:4px;padding:.9rem 1rem;margin:0 0 1rem}
.allcard .an{font-size:.8rem;letter-spacing:.2em;opacity:.75}
.allcard .as{font-size:1.15rem;font-weight:700;margin:.15rem 0;line-height:1.4}
.allcard .badge{background:var(--shu)}
.slogan{background:var(--ink);color:var(--paper);border-radius:4px;padding:.8rem 1rem;margin:.7rem 0}
.slogan .gen{font-size:.78rem;opacity:.75;letter-spacing:.15em}
.slogan .txt{font-size:1.2rem;font-weight:700;margin:.2rem 0;line-height:1.4}
.slogan p{margin:.3rem 0 0;font-size:.88rem;opacity:.9;white-space:pre-wrap}
.slogan .btn{border-color:var(--paper);color:var(--paper);background:transparent}
.slogan textarea,.slogan input{color:var(--ink)}
.emg{border:2px solid var(--shu);background:#FBEDE9;border-radius:4px;padding:.6rem .8rem;margin:.5rem 0}
.emg h4{margin:0 0 .2rem;color:var(--shu)}
.goal{border:1px solid var(--rule);background:var(--sheet);border-radius:4px;padding:.6rem .8rem;margin:.5rem 0}
.goal .gl{position:relative;height:12px;background:#E8E2D4;border-radius:6px;margin:.4rem 0;overflow:hidden}
.goal .gl i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);border-radius:6px}
.goal .gl b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.goal.behind .gl i{background:var(--shu)}
.chips{display:flex;flex-wrap:wrap;gap:.3rem}
.chip{font-size:.78rem;border-radius:10px;padding:0 .55rem;border:1px solid var(--rule)}
.chip.focus{border-color:var(--ok);color:var(--ok)}.chip.restrain{border-color:var(--shu);color:var(--shu)}
.gform{border:1px dashed var(--rule);padding:.6rem;border-radius:4px;margin:.5rem 0;background:#fff}
.nlink{display:inline-block;border:1px solid var(--rule);border-radius:3px;padding:.2rem .6rem;font-size:.82rem;color:var(--ink);text-decoration:none;background:#fff}
.nlink::after{content:" ↗";color:var(--sub)}
.nrow{margin-top:.45rem}
.nplace{display:flex;gap:.6rem;align-items:baseline;padding:.35rem 0;border-bottom:1px dashed var(--rule);flex-wrap:wrap}
.nplace span{font-size:.8rem;color:var(--sub)}
.nplace .nlike{font-size:.82rem;color:var(--ink);border:1px dashed var(--rule);border-radius:3px;padding:.2rem .6rem}
[hidden]{display:none !important}
.hold-chip{font-size:.74rem;color:#7A5A00;background:#FCF2D8;border:1px solid #E5C77A;border-radius:3px;padding:0 .35rem;margin-right:.3rem}
.hold-box{border:1px solid var(--rule);border-left:4px solid #C9A227;border-radius:6px;background:#fff;padding:.5rem .7rem;margin:.2rem 0 .6rem}

.trb{padding:.05rem .55rem;font-size:.78rem;background:#2F5DA8;border-color:#2F5DA8}
.rb-bar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;background:#FFF4F0;border:1px solid #E7B8AC;border-radius:6px;padding:.35rem .6rem;margin:.2rem 0 .5rem;font-size:.86rem}

.ul-box{margin-top:.3rem}.ul-bar{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin:.35rem 0}
.ul-f{border:1px solid var(--rule);background:#fff;border-radius:999px;padding:.1rem .65rem;font:inherit;font-size:.8rem;cursor:pointer}
.ul-f[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.ul-row{display:flex;align-items:center;gap:.45rem;padding:.35rem 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}

.ul-n{flex:1;min-width:8rem;font-weight:700;word-break:break-word}.ul-n small{display:block;font-weight:400;font-size:.72rem;color:var(--sub)}
.ul-del{background:#B3283C;border-color:#B3283C}.ul-arch{background:#5E6A61;border-color:#5E6A61}
.orphan-box{margin-top:1rem}

.linkbox{border:1px solid var(--rule);border-left:4px solid var(--ink);border-radius:6px;background:#fff;padding:.5rem .7rem;margin:.4rem 0}
.lb-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:.3rem}
#tl-q{width:100%;padding:.4rem .55rem;border:1px solid var(--rule);border-radius:5px}
.lb-scope{display:flex;gap:.3rem;margin:.4rem 0}.lb-scope button{border:1px solid var(--rule);background:#fff;border-radius:999px;padding:.1rem .7rem;font:inherit;font-size:.8rem;cursor:pointer}
.lb-scope button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.lb-n{font-size:.76rem;color:var(--sub);margin:.1rem 0 .2rem}
.lb-row{display:flex;align-items:center;gap:.5rem;padding:.35rem 0;border-bottom:1px solid var(--rule)}
.lb-name{flex:1;min-width:0;word-break:break-word;font-weight:700}.lb-name small{display:block;font-weight:400;color:var(--sub);font-size:.72rem}

.tgrp{display:flex;align-items:center;gap:.45rem;padding:.4rem 0;border-bottom:1px dashed var(--rule);flex-wrap:wrap}
.tg-tog{border:1px solid var(--rule);background:#fff;border-radius:4px;width:1.8rem;height:1.8rem;cursor:pointer;color:var(--sub);flex:0 0 auto}
.tg-marks{display:inline-flex;flex-wrap:wrap;gap:.1rem}
.tmark.mini{margin-right:0;padding:0 .3em 0 .1em;font-size:.7em}
.tmark.dim{opacity:.38;filter:grayscale(.5)}
.tg-base{font-weight:700;min-width:0;word-break:break-word}
.tg-sum{font-size:.76rem;color:var(--sub);margin-left:auto;white-space:nowrap}
.tg-body{padding-left:.7rem;border-left:2px solid var(--rule);margin:0 0 .3rem .85rem}

.tmark{display:inline-flex;align-items:center;gap:.18em;padding:0 .42em 0 .14em;margin-right:.32em;border:1px solid var(--tc);border-radius:999px;
  background:color-mix(in srgb,var(--tc) 11%,#fff);vertical-align:.08em;font-size:.78em;line-height:1.55;white-space:nowrap}
.tmark svg{width:1.25em;height:1.25em;flex:0 0 auto}
.tmark b{color:var(--tc);font-weight:700;letter-spacing:.02em}

.tentai{display:inline-block;font-size:.72rem;font-weight:700;color:#fff;border-radius:999px;padding:0 .45rem;margin-right:.3rem;line-height:1.55;vertical-align:.08em;letter-spacing:.02em}
.tt-0{background:#7D838C}.tt-1{background:#C49A1E}.tt-2{background:#2F7A58}.tt-3{background:#C0392B}.tt-4{background:#B5652A}.tt-5{background:#8C7350}.tt-6{background:#2E9C98}.tt-7{background:#2C4FA8}

.tsplit{border:1px solid var(--rule);border-left:4px solid #2C4FA8;border-radius:6px;background:#fff;padding:.5rem .7rem;margin:.2rem 0 .6rem}
.tsplit .ts-h{font-weight:700;margin-bottom:.2rem}.tsplit .ts-e{font-size:.78rem;color:var(--sub);margin:0 0 .4rem}
.ts-n{display:flex;gap:.25rem;flex-wrap:wrap;margin:.2rem 0 .45rem}.ts-n button{min-width:2.2rem;border:1px solid var(--rule);background:#fff;border-radius:4px;padding:.15rem .4rem;cursor:pointer;font:inherit}

.failrow{margin:.2rem 0 .4rem;text-align:right}.failb{color:#8a3a2a;font-size:.8rem}
.failbox{border:1px solid #b3283c55;background:#b3283c0a;border-radius:6px;padding:.5rem .8rem;margin:.4rem 0 .6rem}.failbox .fb-h{font-weight:700;color:#8a2030;margin-bottom:.3rem}.failbox .fb-h small{font-weight:400;color:var(--sub);margin-left:.4rem}
.failb2{background:#8a2030;border-color:#8a2030}.raid-card.failed .ast{background:#8a2030;color:#fff}
.dpicker{width:100%;margin-top:.3rem}.dpks{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.2rem}
.dpk{border:1px solid var(--rule);background:#fff;border-radius:6px;padding:.1rem .4rem;font:inherit;font-size:.78rem;cursor:pointer;line-height:1.2;text-align:center}
.dpk small{display:block;font-size:.66rem;color:var(--sub)}.dpk.sat small{color:#2F6E8A}.dpk.sun small{color:#B3283C}
.dpk[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}.dpk[aria-pressed="true"] small{color:#ddd}
.aedit{display:flex;gap:.3rem;align-items:center;flex-wrap:wrap}.aedit-b{font-size:.72rem;color:var(--sub)}
.amode{font-size:.68rem;border:1px solid var(--rule);border-radius:8px;padding:0 .3rem;color:var(--sub)}
.rpace{font-size:.8rem;color:var(--sub);margin:.2rem 0 .4rem}.rpace.late{color:#B3283C;font-weight:700}
.rplan{border:1px solid #B3283C33;background:#B3283C0d;border-radius:6px;padding:.4rem .7rem;margin:.4rem 0;font-size:.88rem}.rplan small{display:block;color:var(--sub);font-size:.74rem}
.rprog div{display:flex;gap:.5rem;font-size:.8rem;padding:.15rem 0;border-top:1px dashed var(--rule)}.rprog span{color:var(--sub);min-width:3rem}
.tren-b{font-size:.74rem;color:var(--sub)}.tren{display:inline-flex;gap:.3rem;align-items:center}.tren input{min-width:8rem}
.tmarket{border:1px solid var(--rule);border-radius:6px;background:#fff;padding:.4rem .7rem;margin:.3rem 0 .6rem;font-size:.86rem}.tmarket small{display:block;color:var(--sub);font-size:.74rem}.lowcred{color:#B3283C}
.tagpick{display:flex;flex-wrap:wrap;gap:.3rem}.chip-l{border:1px solid var(--rule);border-radius:12px;padding:.05rem .55rem;font-size:.8rem;background:#fff}
.tshares{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}.tshares input{width:4rem}.tshare{display:block;color:#4A7FC1;font-size:.7rem}
.linksel{margin-top:.4rem}.linksel select{max-width:100%;font-size:.84rem}.tunl{font-size:.72rem;color:var(--sub)}.tfold select{font-size:.76rem;max-width:11rem}
.tparts{display:inline-flex;gap:2px}.tpart-b{border:1px solid var(--rule);background:#fff;border-radius:3px;padding:0 .35rem;font:inherit;font-size:.7rem;cursor:pointer;color:var(--sub);min-width:1.4rem}
.tpart-b[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tbadge{font-size:.68rem;background:var(--sub);color:#fff;border-radius:9px;padding:0 .4rem;margin-left:.35rem;font-weight:400}.tbadge.emg-b{background:#B3283C}
.mtg-steps{display:flex;gap:.3rem;flex-wrap:wrap;margin:.2rem 0 .7rem}.mtg-steps span{font-size:.8rem;border:1px solid var(--rule);border-radius:12px;padding:.1rem .7rem;color:var(--sub);background:#fff}
.mtg-steps span.on{background:var(--ink);color:#fff;border-color:var(--ink)}.mtg-steps span.done{color:#3D8A5A;border-color:#3D8A5A}
.mrow{display:flex;justify-content:space-between;gap:.6rem;align-items:baseline;padding:.3rem 0;border-bottom:1px dashed var(--rule);font-size:.86rem}.mrow small{display:block;color:var(--sub);font-size:.74rem}
.mrow .ok{color:#3D8A5A}.mrow .ng,.mtr .ng{color:var(--shu)}
.mtbl{overflow-x:auto}.mth,.mtr{display:grid;grid-template-columns:5.5rem repeat(6,4.2rem) auto;gap:.3rem;align-items:center;font-size:.8rem;padding:.25rem 0;border-bottom:1px dashed var(--rule);min-width:36rem}
.mth{color:var(--sub);font-size:.72rem}.mtg-nav{margin-top:.8rem}
.tk select.tpart{width:auto;max-width:5.2rem;font-size:.72rem;padding:.05rem .2rem;height:auto;border-radius:3px}
.tk{align-items:center}
.cform2{display:block}.cf-types{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;margin-bottom:.5rem}
.cf-types button{border:none;background:#fff;padding:.2rem .7rem;font:inherit;font-size:.82rem;cursor:pointer;color:var(--sub)}
.cf-types button+button{border-left:1px solid var(--rule)}.cf-types button[aria-pressed="true"]{background:var(--ink);color:#fff}
.cf-sec{margin:.35rem 0}.cf-h{font-size:.76rem;color:var(--sub);margin-bottom:.2rem}

.cfopt{font-size:.86rem;display:flex;gap:.35rem;align-items:center}.cfopt small{color:var(--sub);font-size:.72rem}
.cf-more summary{font-size:.8rem;color:var(--sub);cursor:pointer;margin:.3rem 0}
.cf-rule{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;font-size:.86rem}
.cform2 textarea{width:100%}
.tfold{margin-top:.8rem}.tfold .tk{display:grid;grid-template-columns:1fr auto auto;gap:.5rem;align-items:center}
.tide-top{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin-bottom:.4rem}
.tperiod{display:inline-flex;margin-left:auto;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.tperiod button{border:none;background:#fff;padding:.2rem .55rem;font:inherit;font-size:.78rem;cursor:pointer;color:var(--sub)}
.tperiod button+button{border-left:1px solid var(--rule)}.tperiod button[aria-pressed="true"]{background:var(--ink);color:#fff}

.t-a{background:#D9534F}.t-p{background:#4A7FC1}.t-r{background:#4FA36B}
.tev{display:block;font-size:.76rem;color:var(--sub);margin-bottom:.3rem}
.trow{display:grid;grid-template-columns:3rem 1fr auto auto;gap:.5rem;align-items:center;padding:.3rem 0;border-top:1px dashed var(--rule);font-size:.86rem}

.tk-p{color:#B3283C}.tk-r{color:#3D8A5A}.tcx{display:flex;gap:.25rem;align-items:center}
.tide-form .frow{align-items:center}.tchips{display:inline-flex;flex-wrap:wrap;gap:.25rem}
.tchips button{border:1px solid var(--rule);background:#fff;border-radius:12px;padding:.05rem .55rem;font:inherit;font-size:.8rem;cursor:pointer}
.tchips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tmix{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}.tmix input{flex:1;min-width:8rem}.tmix b{font-size:.8rem}

.dep.unsure{opacity:.55;border-style:dashed}

.diff .new{background:#E3EEE6;padding:.4rem .6rem;white-space:pre-wrap;font-size:.86rem}
.donut{position:relative;width:180px;height:180px;margin:.6rem auto}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .bg{fill:none;stroke:var(--rule);stroke-width:14}
.donut .fg{fill:none;stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .9s linear,stroke .6s}
.donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

.donut .mid span{font-size:.74rem;color:var(--sub)}
.fold{margin-top:1rem}
.fold>summary{cursor:pointer;color:var(--sub);font-size:.88rem;padding:.4rem 0}
.arc{border-left:3px solid var(--rule);padding:.3rem .7rem;margin:.3rem 0}
.arc summary{cursor:pointer;font-size:.9rem}
.arc .ad{font-size:.74rem;color:var(--sub);margin-left:.4rem}
.arc p{white-space:pre-wrap;font-size:.86rem;margin:.3rem 0 .2rem;line-height:1.7}
.lock{font-size:.82rem;color:var(--sub);border:1px dashed var(--rule);padding:.4rem .6rem;margin:.5rem 0}
/* タブ */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--rule);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:none;background:none;padding:.8rem 0;cursor:pointer;color:var(--sub);font-weight:700}
nav.tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--shu)}
</style>

<script>
(function(){
"use strict";
const APP_VERSION = "2026-10-18 r85";
const KEY_CONN = "sho-conn", KEY_CACHE = "sho-cache";
const P = { gov: "roadmap/gov/structure.json", reviews: "roadmap/gov/reviews", stats: "docs/data/stats.json",
            defs: "roadmap/tasks/defs.json", overlay: "roadmap/tasks/overlay.json", log: "roadmap/tasks/log", applog: "roadmap/tasks/applog" };
const PERIODS = [["日", "1日"], ["週", "1週間"], ["月", "1ヶ月"], ["季", "3ヶ月"]];
const NOTES = "roadmap/gov/notes.json";          // アプリで書くもの(目的・スローガン)
// 体制全体。省と同じ首脳を持ち、スローガンを掲げる。旧「総合的分析と戦略」の役割
const ALL = { tag: "全体", name: "参謀本部" };
// 仮のスローガンは置かない(作戦期も、保存したスローガンもなければ「まだありません」と出す)
const DEFAULT_SLOGANS = [];
const slogans = () => (state.notes.slogans && state.notes.slogans.length) ? state.notes.slogans : DEFAULT_SLOGANS;
// 省の色。紙の地で見分けやすい落ち着いた色を、省の名前の順に割り当てる
const COLORS = ["#B5432F","#2F4F8A","#3D7A55","#8A5A9E","#B07D2A","#2C7F8C","#A8476F","#5B6E2E","#7A4E2D","#3E5FA8","#B06A3B","#4D7F6E","#8C3A3A","#6A5A9E","#4F6D8A","#8A7A2E"];
function colorOf(tag){
  if (tag === ALL.tag) return "#26221E";
  const ms = ((state.gov && state.gov.ministries) || []).map(m => m.tag).sort((a, b) => a.localeCompare(b, "ja"));
  const i = Math.max(0, ms.indexOf(tag));
  return COLORS[i % COLORS.length];
}

const state = { conn: null, gov: null, stats: null, defs: null, overlay: { tasks: {}, newTasks: [] }, logs: {}, applogs: {},
  reviews: {}, reviewShas: {}, loadedMonths: new Set(), open: null, period: "日", tasks: [], notes: { purposes: {} }, notesSha: null, editPurpose: false, editSlogan: false };

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lsGet = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
// 1日は朝5時区切り(行軍表と同じ)
const taskDay = () => window.__shoToday || new Date(Date.now() + 4 * 3600e3).toISOString().slice(0, 10);
const addDays = (d, n) => new Date(Date.parse(d + "T00:00:00Z") + n * 864e5).toISOString().slice(0, 10);

/* ───── 期間 ───── */
function periodStart(kind, day){
  if (kind === "日") return day;
  if (kind === "週") { const w = (new Date(day + "T00:00:00Z").getUTCDay() + 6) % 7; return addDays(day, -w); }
  if (kind === "月") return day.slice(0, 8) + "01";
  const m = +day.slice(5, 7), q = Math.floor((m - 1) / 3) * 3 + 1;
  return day.slice(0, 5) + String(q).padStart(2, "0") + "-01";
}
function periodPrev(kind, start){
  if (kind === "日") return addDays(start, -1);
  if (kind === "週") return addDays(start, -7);
  const y = +start.slice(0, 4), m = +start.slice(5, 7), back = kind === "月" ? 1 : 3;
  const t = new Date(Date.UTC(y, m - 1 - back, 1));
  return t.toISOString().slice(0, 10);
}
function periodLabel(kind, start){
  const md = s => (+s.slice(5, 7)) + "/" + (+s.slice(8, 10));
  if (kind === "日") return md(start);
  if (kind === "週") return md(start) + "〜" + md(addDays(start, 6));
  if (kind === "月") return (+start.slice(5, 7)) + "月";
  return start.slice(0, 4) + "年" + (+start.slice(5, 7)) + "〜" + ((+start.slice(5, 7)) + 2) + "月";
}
const rkey = (tag, kind, start) => tag + "|" + kind + "|" + start;

/* ───── GitHub ───── */
function b64e(str){ const b = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function b64d(b64){ const bin = atob(String(b64).replace(/\s/g, "")); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); }
const repoUrl = () => "https://api.github.com/repos/" + encodeURIComponent(state.conn.owner) + "/" + encodeURIComponent(state.conn.repo);
const headers = extra => Object.assign({ "Authorization": "Bearer " + state.conn.token, "Accept": "application/vnd.github+json" }, extra || {});
async function fetchRetry(url, opts){
  let last;
  for (let i = 0; i < 3; i++) { try { return await fetch(url, opts); } catch (e) { last = e; await new Promise(r => setTimeout(r, 500 * (i + 1))); } }
  throw last;
}
function httpErr(status, path){
  if (status === 401) return new Error("トークンが無効です。設定から入れ直してください。");
  if (status === 409) { const e = new Error("別の場所で更新されていました。"); e.status = 409; return e; }
  const e = new Error("GitHubとの通信に失敗しました(" + status + " " + path + ")。"); e.status = status; return e;
}
async function readJson(path){
  const url = repoUrl() + "/contents/" + path + "?ref=" + encodeURIComponent(state.conn.branch);
  const r = await fetchRetry(url, { headers: headers(), cache: "no-store" });
  if (r.status === 404) return { data: null, sha: null };
  if (!r.ok) throw httpErr(r.status, path);
  const meta = await r.json();
  let text = meta.content ? b64d(meta.content) : null;
  if (text == null) {
    const raw = await fetchRetry(url, { headers: headers({ "Accept": "application/vnd.github.raw+json" }), cache: "no-store" });
    text = await raw.text();
  }
  return { data: JSON.parse(text), sha: meta.sha };
}
async function readBlob(sha){
  const r = await fetchRetry(repoUrl() + "/git/blobs/" + sha, { headers: headers(), cache: "no-store" });
  if (!r.ok) throw httpErr(r.status, sha);
  const b = await r.json();
  return JSON.parse(b.encoding === "base64" ? b64d(b.content) : b.content);
}
// フォルダの一覧。「/log」が広告ブロックなどに止められたら、中身の番号の経路で
async function listDir(path){
  try {
    const r = await fetchRetry(repoUrl() + "/contents/" + path + "?ref=" + encodeURIComponent(state.conn.branch), { headers: headers(), cache: "no-store" });
    if (r.status === 404) return [];
    if (!r.ok) throw httpErr(r.status, path);
    return (await r.json()).filter(x => x.type === "file").map(x => ({ name: x.name, sha: x.sha }));
  } catch (e) {
    if (e.status) throw e;
    const parts = path.split("/"), name = parts.pop();
    const up = await fetchRetry(repoUrl() + "/contents/" + parts.join("/") + "?ref=" + encodeURIComponent(state.conn.branch), { headers: headers(), cache: "no-store" });
    const dir = (await up.json()).find(x => x.name === name && x.type === "dir");
    if (!dir) return [];
    const t = await (await fetchRetry(repoUrl() + "/git/trees/" + dir.sha, { headers: headers(), cache: "no-store" })).json();
    return (t.tree || []).filter(x => x.type === "blob").map(x => ({ name: x.path, sha: x.sha, viaTree: true }));
  }
}
async function writeJson(path, obj, sha){
  const body = { message: "省: 内省を更新", content: b64e(JSON.stringify(obj, null, 1)), branch: state.conn.branch };
  if (sha) body.sha = sha;
  const r = await fetchRetry(repoUrl() + "/contents/" + path, { method: "PUT", headers: headers({ "Content-Type": "application/json" }), body: JSON.stringify(body) });
  if (!r.ok) throw httpErr(r.status, path);
  return (await r.json()).content.sha;
}
async function readMonths(dir, list){
  const out = {};
  for (const f of list.filter(f => /^\d{4}-\d{2}\.json$/.test(f.name))) {
    out[f.name.slice(0, 7)] = f.viaTree ? await readBlob(f.sha) : (await readJson(dir + "/" + f.name)).data || {};
  }
  return out;
}

/* ───── 読み込み ───── */
function status(text, err){ const s = document.getElementById("conn-status"); s.textContent = text; s.classList.toggle("err", !!err); }
async function loadAll(){
  if (!state.conn || !state.conn.token) { showView("settings"); return false; }
  status("読み込んでいます…");
  try {
    const [g, st, d, o, lf, af, nt] = await Promise.all([readJson(P.gov), readJson(P.stats).catch(() => ({})), readJson(P.defs), readJson(P.overlay),
                                                     listDir(P.log), listDir(P.applog), readJson(NOTES)]);
    state.notes = (nt.data && nt.data.purposes) ? nt.data : { purposes: {} }; state.notesSha = nt.sha;
    state.gov = g.data; state.stats = st.data || null; state.defs = d.data;
    state.overlay = o.data || { tasks: {}, newTasks: [] };
    state.logs = await readMonths(P.log, lf);
    state.applogs = await readMonths(P.applog, af);
    state.reviews = {}; state.reviewShas = {}; state.loadedMonths = new Set();
    const now = taskDay();
    await loadReviewMonth(now.slice(0, 7));
    await loadReviewMonth(periodPrev("季", periodStart("季", now)).slice(0, 7)); // 3ヶ月の前回ぶんまで
    await loadReviewMonth(addDays(now.slice(0, 8) + "01", -1).slice(0, 7));
    await loadGov().catch(() => {});
    await loadStaff().catch(() => {});
    if (!pgQ.pending.length) await loadPages().catch(() => {});
    await loadMins().catch(() => {});
    await loadTide().catch(() => {});
    state.tideState = ((await readJson("roadmap/gov/tide_state.json").catch(() => ({}))) || {}).data || null;
    try { const dr = JSON.parse(localStorage.getItem(KEY_DRAFT) || "null"); if (dr && !staff.draft && !currentTerm()) staff.draft = dr; } catch (err) {}
    state.depsAuto = ((await readJson("roadmap/gov/deps_auto.json").catch(() => ({}))) || {}).data || null;
    setTimeout(fromHash, 0);      // 「#page=…」のリンクで開かれたら、そのページへ
    renderPlaces();
    computeTasks();
    lsSet(KEY_CACHE, { gov: state.gov, stats: state.stats, reviews: state.reviews, reviewShas: state.reviewShas, notes: state.notes });
    status("読み込みました");
    render();
    return true;
  } catch (e) { status(e.message, true); renderNotice(e.message); return false; }
}
async function loadReviewMonth(m){
  if (state.loadedMonths.has(m)) return;
  const r = await readJson(P.reviews + "/" + m + ".json");
  state.reviews[m] = r.data || {}; state.reviewShas[m] = r.sha; state.loadedMonths.add(m);
}

/* ───── タスクの今の状態(行軍表と同じ計算) ───── */
function computeTasks(){
  setTimeout(autoReleaseHolds, 0);
  const E = window.TaskEngine;
  if (!E || !state.defs) { state.tasks = []; return; }
  const today = taskDay();
  const defs0 = E.allDefs(state.defs, state.overlay);
  state.tasks = (E.applyGates && pg.doc ? E.applyGates(defs0, pg.doc, state.overlay) : defs0).map(raw => {
    const def = E.mergeOverlay(raw, (state.overlay.tasks || {})[raw.id], today);
    const rep = E.replay(def, E.mergedLogFor(state.logs, state.applogs, def.id), today);
    const last = rep.days.length ? rep.days[rep.days.length - 1] : null;
    const row = last && last.date === today ? last : null;
    const s = row || rep.next;
    return { def, days: rep.days, lastDone: s.lastDone || null, waiting: E.waitingOn ? E.waitingOn(def, today) : null, status: s.status, gen: row ? row.gen : rep.gen, genTotal: s.genTotal, streak: s.streak, total: s.total,
             target: E.targetAt(def, today), check: row ? row.check : null };
  });
}
// 省アプリでは、やめたタスク(アーカイブ)は出さない(記録は残っている)
const HIDDEN_ST = new Set(["アーカイブ"]);
function tasksFor(tag, label, pid){
  const L = String(label || "").toUpperCase();
  return state.tasks.filter(t => !HIDDEN_ST.has(t.status) && (t.def.waves || []).some(w => {
    const m = /#page=([\w-]+)/.exec((w && w.url) || "");
    if (m) return pid ? m[1] === pid : false;                     // リンク付きの結びつきは、そのページにだけ
    return (t.def.ministries || []).includes(tag) && String((w && w.label) || w || "").replace(/\s+/g, "").toUpperCase() === L;
  }));
}

/* ───── 描画 ───── */
function renderNotice(msg){ document.getElementById("notices").innerHTML = msg ? '<p class="notice">' + esc(msg) + "</p>" : ""; }
function powerOf(tag){
  const ml = (state.stats && state.stats.ministry_latest) || [];
  const m = ml.find(x => x.tag === tag || x.ministry === tag);
  return m ? m : null;
}
function openOrders(tag){
  const out = [];
  for (const [m, entries] of Object.entries(state.reviews)) for (const [k, e] of Object.entries(entries || {})) {
    if (tag && e.tag !== tag) continue;
    for (const o of e.orders || []) if (!o.done) out.push({ month: m, key: k, entry: e, order: o });
  }
  return out;
}
function render(){
  document.getElementById("stamp").textContent = state.gov ? ("毎朝の計算 " + state.gov.generated_at) : "—";
  renderNotice(state.gov ? "" : "まだ書き出しがありません。毎朝の計算(App daily)が一度動くと出ます。");
  renderList(); renderDetail(); renderOrders(); renderGov();
}


/* ───────── 時勢(自分で入力する気持ち。数字は決まりが作る) ─────────
   プラス:熱量 × 色(焦燥↔純粋)、漠然さ = 何日かけて効くか、しんどさは重要度とは別に記録
   マイナス:熱量 × 安心の色(手応え↔慣れ)、漠然さ、確かさ
   打ち消し:前のプラスが薄れた割合。効き終わっても下がらない(減衰なし) */
const TIDE = "roadmap/gov/tide.json";
const TIDE_RULES = { days: { "その日だけ": 1, "3日": 3, "1週間": 7, "1か月": 30 }, sure: { "はっきり": 1, "なんとなく": 0.6 }, frac: { "少し": 0.25, "半分": 0.5, "ほとんど": 0.9 } };
const tide = { doc: { version: 1, entries: [] }, sha: null, form: null, period: "1週間", cancel: null };
async function loadTide(){ const r = await readJson(TIDE); tide.doc = Object.assign({ version: 1, entries: [] }, r.data || {}); tide.sha = r.sha; }
async function saveTide(mutate){
  mutate(tide.doc); renderList();
  for (let i = 0; i < 3; i++) {
    try { tide.sha = await writeJson(TIDE, tide.doc, tide.sha); return true; }
    catch (e) { if ((e.status === 409 || e.status === 422) && i < 2) { await loadTide(); mutate(tide.doc); continue; } renderNotice("時勢を保存できませんでした:" + e.message); return false; }
  }
}
const dayDiff = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
// 1件の時勢の大きさ(焦燥・純粋・安心に分けて)。打ち消しは元の残りに対する割合
function tideParts(e){
  if (e.type === "plus") { const m = (e.mix ?? 5) / 10; return { 焦燥: e.heat * m, 純粋: e.heat * (1 - m), 安心: 0 }; }
  if (e.type === "minus") return { 焦燥: 0, 純粋: 0, 安心: -e.heat * (TIDE_RULES.sure[e.sure] || 1) };
  return { 焦燥: 0, 純粋: 0, 安心: 0 };
}
function cancelsOf(id){ return tide.doc.entries.filter(x => x.type === "cancel" && x.target === id && !x.deleted).sort((a, b) => a.date < b.date ? -1 : 1); }
function remainRatio(e, day){ let r = 1; cancelsOf(e.id).forEach(c => { if (!day || c.date <= day) r *= (1 - (TIDE_RULES.frac[c.frac] || 0.5)); }); return r; }
// その日までに効いた量(漠然さの日数に分けて毎日少しずつ。打ち消しはその日に効く)
function tideAt(e, day){
  if (e.deleted || e.type === "cancel" || day < e.date) return { 焦燥: 0, 純粋: 0, 安心: 0 };
  const D = TIDE_RULES.days[e.vague] || 1, k = Math.min(1, (dayDiff(e.date, day) + 1) / D), r = remainRatio(e, day), p = tideParts(e);
  return { 焦燥: p.焦燥 * k * r, 純粋: p.純粋 * k * r, 安心: p.安心 * k };
}

// 時勢の分野と割合(1件を複数の省に割合で分けられる)。前の形(分野1つ)もそのまま読む。打ち消しは元の時勢の割合
function tideShares(e){
  const src = e.type === "cancel" ? (tide.doc.entries.find(x => x.id === e.target) || {}) : e;
  const arr = Array.isArray(src.tags) && src.tags.length ? src.tags : (src.tag ? [{ tag: src.tag, share: 1 }] : []);
  const sum = arr.reduce((a, x) => a + Math.max(0, +x.share || 0), 0) || 1;
  return arr.map(x => ({ tag: x.tag, share: Math.max(0, +x.share || 0) / sum }));
}
const shareOf = (e, tag) => (tideShares(e).find(x => x.tag === tag) || { share: 0 }).share;
const scaleParts = (p, k) => ({ 焦燥: p.焦燥 * k, 純粋: p.純粋 * k, 安心: p.安心 * k });

function bindTide(){

  box.addEventListener("click", async e => {
    let b;

    if (e.target.closest("[data-tide-close]")) { tide.form = null; renderList(); return; }
    if ((b = e.target.closest("[data-tide-period]"))) { tide.period = b.dataset.tidePeriod; renderList(); return; }
    if ((b = e.target.closest("[data-tf-tagc]"))) { const f0 = readTideForm(); f0.tags.forEach(x => { x.pct = 100 / (f0.tags.length || 1); }); tide.draft = Object.assign(tide.draft || {}, f0); renderList(); return; }
    if ((b = e.target.closest(".tchips [data-v]"))) { const g = b.closest("[data-tf]").dataset.tf; tide.draft = Object.assign(tide.draft || {}, readTideForm(), { [g]: isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v }); renderList(); return; }

      const f = Object.assign({ heat: 3, mix: 5, vague: "1週間", burden: 0, sure: "はっきり" }, tide.draft || {}, readTideForm()), type = b.dataset.tideSave;
      const tags = (f.tags || []).filter(x => x.tag);
      if (!tags.length) { renderNotice("分野(省)を1つ以上選んでください。"); return; }
      const tsum = tags.reduce((a, x) => a + (+x.pct || 0), 0) || 1;
      const ent = { id: "td" + uid(), type, date: taskDay(), tag: tags[0].tag, tags: tags.map(x => ({ tag: x.tag, share: Math.round((+x.pct || 0) / tsum * 1000) / 1000 })), heat: +f.heat, mix: +f.mix, vague: f.vague, note: f.note || "" };
      if (type === "plus") ent.burden = +f.burden || 0; else ent.sure = f.sure;
      tide.form = null; tide.draft = {};
      await saveTide(doc => { doc.entries.push(ent); }); return;
    }
    if ((b = e.target.closest("[data-tide-cancel]"))) { tide.cancel = b.dataset.tideCancel; renderList(); return; }
    if (e.target.closest("[data-tide-cancel-x]")) { tide.cancel = null; renderList(); return; }
    if ((b = e.target.closest("[data-tide-cancel-do]"))) { const [id, frac] = b.dataset.tideCancelDo.split(":"); tide.cancel = null;
      await saveTide(doc => { doc.entries.push({ id: "td" + uid(), type: "cancel", date: taskDay(), target: id, frac, note: "" }); }); return; }
    if ((b = e.target.closest("[data-tide-del]"))) { if (!confirm("この記録を消しますか。")) return; const id = b.dataset.tideDel; await saveTide(doc => { const x = doc.entries.find(z => z.id === id); if (x) x.deleted = taskDay(); }); return; }
  });

}
function readTideForm(){
  const g = id => document.getElementById(id); if (!g("tf-mix")) return {};

async function overlayWrite(mutate){

    const r = await readJson("roadmap/tasks/overlay.json"), ov = r.data || { version: 1, tasks: {}, newTasks: [] };
    ov.tasks = ov.tasks || {}; mutate(ov);
    try { await writeJson("roadmap/tasks/overlay.json", ov, r.sha); state.overlay = ov; computeTasks(); return true; }
    catch (err) { if (err.status !== 409 && err.status !== 422) { renderNotice("保存できませんでした:" + err.message); return false; } }

}

  const ids = new Set(ps.map(p => p.id)), keys = new Set(ps.map(p => rootTag(p) + "|" + String(p.label).toUpperCase()));

async function mergeTentai(group){

  });

          const cc = Object.assign({}, c, { id: String(c.id).replace(/_t\d+$/, ""), task: base }); delete cc.fromTentai; out.push(cc); }
        else out.push(c);

async function renameTask(id, name){
  name = String(name || "").trim();
  const t = state.tasks.find(x => x.def.id === id); if (!t) return "タスクが見つかりません。";
  if (!name) return "名前を入れてください。";
  if (name === t.def.name) return "";
  if (state.tasks.some(x => x.def.id !== id && (x.def.name === name || (x.def.aliases || []).includes(name)))) return "同じ名前のタスクがあります。";
  const old = t.def.name;
  const ok = await overlayWrite(ov => { const o = ov.tasks[id] = Object.assign({}, ov.tasks[id] || {}); o.edits = Object.assign({}, o.edits || {}, { name }); });
  if (!ok) return "保存できませんでした。";
  for (let i = 0; i < 3; i++) {
    try {
      const r = await readJson("roadmap/settings.json"); const st = r.data; if (!st || !st.tasks) break;
      let changed = false;
      if (st.tasks[old] && !st.tasks[name]) { st.tasks[name] = st.tasks[old]; delete st.tasks[old]; changed = true; }
      for (const c of Object.values(st.tasks)) for (const k of Object.keys(c || {})) {
        if (c[k] === old) { c[k] = name; changed = true; }
        else if (Array.isArray(c[k]) && c[k].includes(old)) { c[k] = c[k].map(x => x === old ? name : x); changed = true; }
      }
      if (changed) await writeJson("roadmap/settings.json", st, r.sha);
      break;
    } catch (err) { if (err.status !== 409 && err.status !== 422) break; }
  }
  logPlan(t.def.ministries, "タスクを直した", id, old + " → " + name);
  return "";
}

const kenseiinNote = what => '<div class="lock" style="margin:.4rem 0">' + what + '<a href="' + KENSEIIN_APP + '" target="_blank" rel="noopener">憲政院アプリを開く</a></div>';

async function loadGov(){
  const [c, a, k, ar] = await Promise.all([readJson(GOVP.cons), readJson(GOVP.amend), readJson(GOVP.council), readJson(ARCHIVE).catch(() => ({}))]);
  gov.archive = ar.data || null;
  gov.cons = c.data; gov.consSha = c.sha;
  gov.amend = (a.data && a.data.items) ? a.data : { items: [] }; gov.amendSha = a.sha;
  gov.council = Object.assign({ supreme: [], standing: [] }, k.data || {}); gov.councilSha = k.sha;
}

// 保存。別の端末で先に変わっていたら読み直して同じ操作をかけ直す
async function saveGov(which, mutate){
  const path = GOVP[which], key = which === "cons" ? "cons" : which;
  const shaKey = key + "Sha";
  for (let i = 0; i < 3; i++) {
    try {
      const ok = mutate();
      if (ok === false) return false;
      gov[shaKey] = await writeJson(path, gov[key], gov[shaKey]);
      return true;
    } catch (e) {
      if ((e.status === 409 || e.status === 422) && i < 2) {
        const fresh = await readJson(path);
        gov[key] = fresh.data || (which === "amend" ? { items: [] } : which === "council" ? { supreme: [], standing: [] } : null);
        gov[shaKey] = fresh.sha; continue;
      }
      govMsg(e.message || "保存できませんでした", true);
      return false;
    }
  }
  return false;
}
function govMsg(t, err){ const el = document.getElementById("gov-msg"); if (el) { el.textContent = t; el.classList.toggle("err", !!err); } }

// 改憲案の状態。期間と審議の記録から決まる
function amendStatus(a){
  if (a.session && a.session.closedAt) return a.session.decision === "可決" ? "可決" : "否決";
  if (!a.submitted) return "起草中";
  const d = taskDay();
  if (a.session && a.session.startedAt) return "審議中";
  if (d < a.periodStart) return "審議待ち";
  if (d > a.periodEnd) return "廃案";
  return "審議できる";
}
function sessionLive(sess){ return sess && sess.startedAt && !sess.closedAt; }
function timeLeft(sess){ return sess ? Math.max(0, Date.parse(sess.endsAt) - Date.parse(nowIso())) : 0; }
const stClass = st => ({ "可決": "ok", "実施済み": "ok", "議決": "ok", "否決": "ng", "廃案": "ng", "審議中": "live", "審議できる": "live" }[st] || "");

function renderGov(){
  const box = document.getElementById("gov");
  if (!box) return;
  clearInterval(gov.timer);
  if (!gov.view) return renderGovHome(box);
  if (gov.view === "憲法") return renderCons(box);
  if (gov.view === "憲政院") return renderKenseiin(box);
  if (gov.view === "最高評議会") return renderSupreme(box);
  if (gov.view === "常任評議会") return renderStanding(box);
  if (gov.view === "議題候補") return renderCandidates(box);
}

// 議題候補:思いついた議題を溜めておき、機が熟したら評議会にかける

  const ms = (state.gov && state.gov.ministries) || [];
  const tagName = t => t === "全体" ? "全体" : ((ms.find(m => m.tag === t) || { name: t || "" }).name);
  const all = (gov.council.candidates || []).slice();
  const live = all.filter(c => c.status === "候補").sort((a, b) => (b.star ? 1 : 0) - (a.star ? 1 : 0) || (a.created < b.created ? 1 : -1));
  const done = all.filter(c => c.status !== "候補").sort((a, b) => (a.closedAt < b.closedAt ? 1 : -1));
  const row = c => '<div class="goal" style="margin:.4rem 0"><div style="display:flex;justify-content:space-between;gap:.5rem;align-items:baseline">' +
      '<b>' + (c.star ? "★ " : "") + esc(c.title) + '</b><span style="font-size:.76rem;color:var(--sub);white-space:nowrap">' + esc(tagName(c.tag)) + "　" + esc(c.created) + "</span></div>" +
      (c.status === "候補"
        ? '<textarea data-cd-note="' + esc(c.id) + '" placeholder="メモ(なぜ話したいか、気づいたこと)" style="min-height:2.6rem;margin-top:.3rem">' + esc(c.note || "") + "</textarea>" +
          '<div style="display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.35rem">' +
          '<button type="button" class="btn ghost sm" data-cd-star="' + esc(c.id) + '">' + (c.star ? "★を外す" : "★") + "</button>" +
          '<button type="button" class="btn sm" data-cd-to="常任評議会" data-cd="' + esc(c.id) + '">常任評議会へ</button>' +
          '<button type="button" class="btn sm" data-cd-to="最高評議会" data-cd="' + esc(c.id) + '">最高評議会へ</button>' +
          '<button type="button" class="btn ghost sm" data-cd-skip="' + esc(c.id) + '">見送る</button>' +
          '<button type="button" class="del" data-cd-del="' + esc(c.id) + '">消す</button></div>'
        : (c.note ? '<p style="white-space:pre-wrap;font-size:.84rem;margin:.3rem 0">' + esc(c.note) + "</p>" : "") +
          '<div style="font-size:.8rem;color:var(--sub)">' + esc(c.status) + (c.promotedTo ? "(" + esc(c.promotedTo) + ")" : "") + "　" + esc(c.closedAt || "") +
          (c.status === "見送り" ? '　<button type="button" class="del" data-cd-back="' + esc(c.id) + '">候補に戻す</button>' : "") + "</div>") + "</div>";
  box.innerHTML = backBtn + '<div class="mh"><h2>議題候補</h2></div>' +
    '<p style="font-size:.84rem;color:var(--sub)">思いついた議題はここに溜めておき、機が熟したら評議会にかける。★を付けた候補は上に来る。</p>' +
    '<div class="addrow"><input id="cd-title" placeholder="議題候補"><select id="cd-tag" style="max-width:7rem"><option value="">分野</option><option value="全体">全体</option>' +
      ms.map(m => '<option value="' + esc(m.tag) + '">' + esc(m.name) + "</option>").join("") + '</select><button type="button" class="btn sm" data-cd-add>溜める</button></div>' +
    (live.length ? live.map(row).join("") : '<div class="empty">候補はありません。</div>') +
    foldHtml("議題にしたもの・見送ったもの", done.map(row).join(""), done.length) +
    '<span class="status" id="gov-msg"></span>';
}

  const c = gov.cons;

  const changed = {};
  for (const h of c.history || []) for (const id of h.articles || []) changed[id] = h.version;
  box.innerHTML = backBtn + '<div class="mh"><h2>' + esc(c.title) + '</h2><span>第' + c.version + "版</span></div>" +
    (c.copyOf === "kenseiin" ? kenseiinNote("これは写しです。本物は憲政院アプリにあります。改正は、憲政院アプリで起草し、2日あけて最高評議会で可決します。")
      : '<p class="lock">この本文はここから直接は書き換えられません。変えるには、憲政院で改憲案を起草し、2日あけて最高評議会で可決する必要があります。</p>') +

    '<div class="sec"><h3>改正の履歴</h3>' + (c.history || []).slice().reverse().map(h => '<div class="decree"><div class="dd">第' + h.version + "版　" + esc(h.date) + "</div>" + esc(h.note || "") + "</div>").join("") + "</div>";

    const a = arts.find(x => x.id === c.articleId);
    return '<div class="peditor" style="margin:.4rem 0;background:#fff;border:1px solid var(--rule);padding:.5rem;border-radius:3px">' +
      '<div class="f"><label>変える条文</label><select data-ch-art="' + i + '"' + (locked ? " disabled" : "") + ">" +
        arts.map(x => '<option value="' + esc(x.id) + '"' + (x.id === c.articleId ? " selected" : "") + ">" + esc("　".repeat(x.depth) + x.title) + "</option>").join("") + "</select></div>" +
      (a ? '<div class="diff"><div class="old">' + esc(a.text || "(本文なし)") + "</div></div>" : "") +
      '<div class="f"><label>新しい文</label><textarea data-ch-text="' + i + '"' + (locked ? " disabled" : "") + ">" + esc(c.newText) + "</textarea></div>" +
      (locked ? "" : '<button type="button" class="btn ghost sm" data-ch-del="' + i + '">この変更を外す</button>') + "</div>";
  }).join("");
  box.innerHTML = '<button type="button" class="back" data-draft-close>‹ 憲政院</button>' +
    '<div class="mh"><h2>改憲案</h2><span>' + amendStatus(d) + "</span></div>" +
    (locked ? '<p class="lock">提出済みです。改憲案も審議期間も、もう変えられません。</p>' : "") +
    '<div class="f"><label>題名</label><input id="am-title" value="' + esc(d.title) + '"' + (locked ? " disabled" : "") + "></div>" +
    '<div class="f" style="margin-top:.5rem"><label>改正の理由</label><textarea id="am-reason"' + (locked ? " disabled" : "") + ">" + esc(d.reason) + "</textarea></div>" +
    '<h3 style="font-size:.9rem;margin:1rem 0 .3rem">変える条文</h3>' + ch +
    (locked ? "" : '<button type="button" class="btn ghost sm" data-ch-add>条文の変更を足す</button>') +
    '<h3 style="font-size:.9rem;margin:1rem 0 .3rem">審議期間</h3>' +
    '<p style="font-size:.8rem;color:var(--sub);margin:.1rem 0 .4rem">起草した日(' + esc(d.created) + ")から2日あけるので、始められるのは " + esc(earliest) + " 以降。</p>" +
    '<div class="grid2"><div class="f"><label>始め</label><input id="am-start" type="date" min="' + earliest + '" value="' + esc(d.periodStart || earliest) + '"' + (locked ? " disabled" : "") + "></div>" +
    '<div class="f"><label>終わり</label><input id="am-end" type="date" min="' + earliest + '" value="' + esc(d.periodEnd || addDays(earliest, 6)) + '"' + (locked ? " disabled" : "") + "></div></div>" +
    (locked ? "" : '<div class="row" style="margin-top:.8rem;display:flex;gap:.5rem;flex-wrap:wrap"><button type="button" class="btn ghost" data-draft-save>下書きを保存</button>' +
      '<button type="button" class="btn" data-draft-submit>提出する</button></div>') +
    '<span class="status" id="gov-msg"></span>';
}

function readDraft(d){
  const v = id => (document.getElementById(id) || {}).value;
  d.title = (v("am-title") || "").trim(); d.reason = (v("am-reason") || "").trim();
  d.periodStart = v("am-start") || d.periodStart; d.periodEnd = v("am-end") || d.periodEnd;
  (d.changes || []).forEach((c, i) => {
    const a = document.querySelector('[data-ch-art="' + i + '"]'), t = document.querySelector('[data-ch-text="' + i + '"]');
    if (a) c.articleId = a.value; if (t) c.newText = t.value;
  });
}
function putAmend(d){
  const items = gov.amend.items;
  const i = items.findIndex(x => x.id === d.id);
  const prev = i >= 0 ? items[i] : null;
  if (prev && prev.submitted) return false;                 // 提出済みは書き換えさせない
  const copy = JSON.parse(JSON.stringify(d));
  if (i >= 0) items[i] = copy; else items.push(copy);
  return true;
}

    '<div class="sec"><h3>改憲の審議</h3>' + (movedToKenseiin() ? kenseiinNote("改憲の審議は、憲政院アプリの最高評議会で行います。")
      : (aLive.length ? aLive.map(aRow).join("") : '<div class="empty">審議を待っている改憲案はありません。</div>') + foldHtml("これまでの改憲", aDone.map(aRow).join(""), aDone.length)) + "</div>" +
    '<div class="sec"><h3>重大国策の審議</h3>' +
      '<div class="addrow"><input id="pol-title" placeholder="議題"><button type="button" class="btn sm" data-pol-new>議題を立てる</button></div>' +
      pLive.map(pRow).join("") + foldHtml("これまでの議決", pDone.map(pRow).join(""), pDone.length) + "</div>" +
    archiveHtml("supreme", "Notionの記録") +

function sessionBlock(sess, closedHtml){
  if (sess && sess.closedAt) return closedHtml;
  if (!sessionLive(sess)) {
    return '<div class="f" style="max-width:12rem"><label>制限時間</label><select id="ss-limit">' + LIMITS.map(m => '<option value="' + m + '"' + (m === 30 ? " selected" : "") + ">" + m + "分</option>").join("") + "</select></div>" +
      '<div style="margin-top:.6rem"><button type="button" class="btn" data-ss-start>審議を始める</button></div>';
  }
  const left = timeLeft(sess), over = left <= 0;
  return donutHtml(sess) +
    (over ? '<p class="lock">制限時間が終わりました。理由はもう書き足せません。今の考えで議決してください。</p>' : "");
}

// ドーナツの時計:残り時間が輪の形で減っていく
const RING_R = 76, RING_C = 2 * Math.PI * RING_R;
function ringColor(frac){ return frac > 0.5 ? "var(--ok)" : frac > 0.2 ? "#B07D2A" : "var(--shu)"; }
function donutHtml(sess){
  const total = Math.max(1, Date.parse(sess.endsAt) - Date.parse(sess.startedAt)), left = timeLeft(sess), frac = Math.max(0, Math.min(1, left / total));
  return '<div class="donut" role="timer" aria-label="残り時間"><svg viewBox="0 0 180 180"><circle class="bg" cx="90" cy="90" r="' + RING_R + '"></circle>' +
    '<circle class="fg" id="ss-ring" cx="90" cy="90" r="' + RING_R + '" stroke="' + ringColor(frac) + '" stroke-dasharray="' + RING_C.toFixed(1) +
    '" stroke-dashoffset="' + (RING_C * (1 - frac)).toFixed(1) + '"></circle></svg>' +
    '<div class="mid"><b id="ss-timer">' + fmtLeft(left) + "</b><span>" + (left > 0 ? "残り" : "時間です") + "</span></div></div>";
}
function fmtLeft(ms){ const s = Math.ceil(ms / 1000); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
function startTimer(sess){
  if (!sessionLive(sess)) return;
  gov.timer = setInterval(() => {
    const el = document.getElementById("ss-timer"); if (!el) { clearInterval(gov.timer); return; }
    const left = timeLeft(sess); el.textContent = fmtLeft(left);
    const ring = document.getElementById("ss-ring");
    if (ring) {
      const total = Math.max(1, Date.parse(sess.endsAt) - Date.parse(sess.startedAt)), frac = Math.max(0, Math.min(1, left / total));
      ring.setAttribute("stroke-dashoffset", (RING_C * (1 - frac)).toFixed(1)); ring.setAttribute("stroke", ringColor(frac));
    }
    if (left <= 0) { clearInterval(gov.timer); renderGov(); }
  }, 1000);
}

function renderAmendSession(box, a){
  if (!a) { gov.open = null; return renderSupreme(box); }
  const st = amendStatus(a), sess = a.session || {};
  const arts = (gov.cons && gov.cons.articles) || [];
  const diffs = (a.changes || []).map(c => { const art = arts.find(x => x.id === c.articleId);
    return "<h4 style='margin:.6rem 0 .2rem;font-size:.88rem'>" + esc(art ? art.title : "(条文)") + "</h4>" +
      '<div class="diff"><div class="old">' + esc(c.oldText != null ? c.oldText : (art ? art.text : "")) + '</div><div class="new">' + esc(c.newText) + "</div></div>"; }).join("");
  const live = sessionLive(sess), over = live && timeLeft(sess) <= 0;
  const closed = '<div class="decree"><div class="dd">' + esc((sess.closedAt || "").slice(0, 10)) + "　議会終了</div>" + esc(sess.decision) + "</div>" +
    "<h4>賛成の理由</h4><p style='white-space:pre-wrap'>" + esc(sess.pro || "") + "</p><h4>反対の理由</h4><p style='white-space:pre-wrap'>" + esc(sess.con || "") + "</p>" +
    '<p class="lock">議決は確定しています。書き換えられません。</p>';
  box.innerHTML = '<button type="button" class="back" data-sclose>‹ 最高評議会</button>' +
    '<div class="mh"><h2>' + esc(a.title) + '</h2><span class="st ' + stClass(st) + '">' + st + "</span></div>" +
    '<p style="font-size:.84rem;color:var(--sub)">審議期間 ' + esc(a.periodStart) + "〜" + esc(a.periodEnd) + "</p>" +
    "<h4>改正の理由</h4><p style='white-space:pre-wrap;font-size:.9rem'>" + esc(a.reason) + "</p>" + diffs +
    (st === "審議待ち" ? '<p class="lock">審議期間は ' + esc(a.periodStart) + " から。まだ審議できません。</p>" : "") +
    (st === "廃案" ? '<p class="lock">審議期間のうちに審議されなかったので廃案になりました。</p>' : "") +
    ((st === "審議できる" || st === "審議中" || st === "可決" || st === "否決") ? sessionBlock(sess, closed) : "") +
    (live ? '<div class="f" style="margin-top:.5rem"><label>賛成の理由</label><textarea id="ss-pro"' + (over ? " disabled" : "") + ">" + esc(sess.pro || "") + "</textarea></div>" +
      '<div class="f" style="margin-top:.5rem"><label>反対の理由</label><textarea id="ss-con"' + (over ? " disabled" : "") + ">" + esc(sess.con || "") + "</textarea></div>" +
      (over ? "" : '<div style="margin-top:.4rem"><button type="button" class="btn ghost sm" data-ss-save>書いたところまで保存</button></div>') +
      '<div style="margin-top:.8rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap"><label><input type="radio" name="ss-dec" value="可決"> 可決</label><label><input type="radio" name="ss-dec" value="否決"> 否決</label>' +
      '<button type="button" class="btn" data-ss-close>議会終了を宣言する</button></div>' : "") +
    '<span class="status" id="gov-msg"></span>';
  startTimer(sess);
}

function renderPolicySession(box, p){
  if (!p) { gov.open = null; return renderSupreme(box); }
  const live = sessionLive(p), over = live && timeLeft(p) <= 0;
  const closed = '<div class="decree"><div class="dd">' + esc((p.closedAt || "").slice(0, 10)) + "　議決</div>" + esc(p.decision) + "</div>" +
    (p.notes ? "<h4>審議の記録</h4><p style='white-space:pre-wrap'>" + esc(p.notes) + "</p>" : "") + '<p class="lock">議決は確定しています。書き換えられません。</p>';
  box.innerHTML = '<button type="button" class="back" data-sclose>‹ 最高評議会</button><div class="mh"><h2>' + esc(p.title) + "</h2></div>" +
    sessionBlock(p, closed) +
    (live ? '<div class="f" style="margin-top:.5rem"><label>審議の記録</label><textarea id="ps-notes"' + (over ? " disabled" : "") + ">" + esc(p.notes || "") + "</textarea></div>" +
      '<div class="f" style="margin-top:.5rem"><label>議決(決めたこと)</label><textarea id="ps-dec">' + esc(p.decision || "") + "</textarea></div>" +
      '<div style="margin-top:.6rem;display:flex;gap:.5rem"><button type="button" class="btn ghost sm" data-ps-save>保存</button><button type="button" class="btn" data-ps-close>議会終了を宣言する</button></div>' : "") +
    '<span class="status" id="gov-msg"></span>';
  startTimer(p);
}

// 常任評議会の議題の状態。審議の記録と実行のチェックから決まる
function standingStatus(it){
  if (it.status === "実施済み") return "実施済み";
  if (it.decidedAt) {
    const os = it.orders || [];
    return os.length && os.every(o => o.done) ? "実施済み" : "議決";
  }
  if ((it.sessions || []).length) return "審議中";
  if (it.status === "審議中" && (it.discussion || it.summary)) return "審議中";   // 前の形で書いた議題
  return "未審議";
}
const liveSession = it => { const ss = it.sessions || []; const l = ss[ss.length - 1]; return l && !l.closedAt ? l : null; };
const stTotalMin = it => Math.round((it.sessions || []).reduce((m, x) => m + (Date.parse(x.closedAt || x.endsAt) - Date.parse(x.startedAt)) / 60000, 0));

function archiveHtml(key, label){
  const list = (gov.archive && gov.archive[key]) || [];
  const items = list.filter(a => a.depth > 0 && (a.text || "").trim());
  if (!items.length) return "";
  return '<details class="fold"><summary>アーカイブ(' + esc(label) + ") " + items.length + "件</summary>" +
    items.map(a => '<details class="arc"><summary>' + esc(a.title) + (a.date ? '<span class="ad">' + esc(a.date) + "</span>" : "") +
      (a.path && a.path.length > 1 ? '<span class="ad">' + esc(a.path.slice(1).join(" / ")) + "</span>" : "") + "</summary><p>" + esc(a.text) + "</p></details>").join("") + "</details>";
}
function foldHtml(label, inner, n){ return n ? '<details class="fold"><summary>' + esc(label) + " " + n + "件</summary>" + inner + "</details>" : ""; }

function renderStanding(box){
  const open = gov.open && gov.open.kind === "standing" ? gov.council.standing.find(x => x.id === gov.open.id) : null;
  if (open) {
    const st = standingStatus(open), live = liveSession(open), left = live ? timeLeft(live) : 0, over = live && left <= 0;
    const decided = !!open.decidedAt;
    const canWrite = !decided && (!live || !over);
    box.innerHTML = '<button type="button" class="back" data-sclose>‹ 常任評議会</button>' +
      '<div class="mh"><h2>' + esc(open.title) + '</h2><span class="st ' + stClass(st) + '">' + st + "</span></div>" +
      '<p style="font-size:.8rem;color:var(--sub);margin:.3rem 0">立てた日 ' + esc(open.created) + ((open.sessions || []).length ? "　審議 " + open.sessions.length + "回・計" + stTotalMin(open) + "分" : "") + "</p>" +
      // 審議(制限時間)
      (!decided ? (live
        ? donutHtml(live) +
          (over ? '<p class="lock">時間です。続けるなら延長、今日はここまでなら区切ってください。</p>' : "") +
          '<div style="display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center"><button type="button" class="btn ghost sm" data-st-ext="10">+10分延長</button>' +
          '<button type="button" class="btn ghost sm" data-st-ext="30">+30分延長</button><button type="button" class="btn ghost sm" data-st-pause>区切る(続きは後で)</button></div>'
        : '<div style="display:flex;gap:.5rem;align-items:flex-end;flex-wrap:wrap"><div class="f" style="width:9rem"><label>制限時間</label><select id="st-limit">' +
            LIMITS.map(m => '<option value="' + m + '"' + (m === 30 ? " selected" : "") + ">" + m + "分</option>").join("") + "</select></div>" +
          '<button type="button" class="btn" data-st-start>' + ((open.sessions || []).length ? "審議を再開する" : "審議を始める") + "</button></div>") : "") +
      '<div class="f" style="margin-top:.8rem"><label>概要(議論の要点を短く)</label><textarea id="st-sum" style="min-height:4rem"' + (canWrite ? "" : " disabled") + ">" + esc(open.summary || "") + "</textarea></div>" +
      '<div class="f" style="margin-top:.5rem"><label>議論</label><textarea id="st-disc"' + (canWrite ? "" : " disabled") + ">" + esc(open.discussion || "") + "</textarea></div>" +
      '<div class="f" style="margin-top:.5rem"><label>決定</label><textarea id="st-dec" style="min-height:4rem"' + (decided ? " disabled" : "") + ">" + esc(open.decision || "") + "</textarea></div>" +
      (!decided ? '<div style="margin-top:.6rem;display:flex;gap:.5rem;flex-wrap:wrap"><button type="button" class="btn ghost" data-st-save>保存する</button><button type="button" class="btn" data-st-decide>議決する</button></div>'
                : '<div style="margin-top:.6rem;display:flex;gap:.5rem;flex-wrap:wrap"><button type="button" class="btn ghost sm" data-st-reopen>審議に戻す</button>' +
                  (st !== "実施済み" && !(open.orders || []).length ? '<button type="button" class="btn sm" data-st-done>実施済みにする</button>' : "") + "</div>") +
      '<h4 style="margin:1rem 0 .3rem">決めたことの実行</h4><ul class="orders">' + (open.orders || []).map(o => '<li class="' + (o.done ? "done" : "") + '"><input type="checkbox" data-st-check="' + esc(o.id) + '"' + (o.done ? " checked" : "") +
        '><span class="ot">' + esc(o.text) + '</span><button type="button" class="del" data-st-del="' + esc(o.id) + '">消す</button></li>').join("") + "</ul>" +
      '<div class="addrow"><input id="st-new" placeholder="やること"><button type="button" class="btn sm" data-st-add>足す</button></div>' +
      '<div style="margin-top:1.4rem"><button type="button" class="btn ghost sm" data-st-remove style="border-color:var(--shu);color:var(--shu)">この議題を消す</button></div>' +
      '<span class="status" id="gov-msg"></span>';
    if (live && !over) startTimer(live);
    return;
  }
  const all = gov.council.standing.slice().reverse();
  const order = { "審議中": 0, "未審議": 1, "議決": 2, "実施済み": 3 };
  all.sort((x, y) => order[standingStatus(x)] - order[standingStatus(y)]);
  const items = all.filter(x => standingStatus(x) !== "実施済み"), done = all.filter(x => standingStatus(x) === "実施済み");
  box.innerHTML = backBtn + '<div class="mh"><h2>常任評議会</h2></div>' +
    '<p style="font-size:.84rem;color:var(--sub)">議題は先に立てておいて、審議は後でもいい。</p>' +
    '<div class="addrow"><input id="st-title" placeholder="議題"><button type="button" class="btn sm" data-st-new>議題を立てる</button></div>' +
    (items.length ? items.map(stRow).join("") : '<div class="empty">動いている議題はありません。</div>') +
    foldHtml("これまでの実施済み", done.map(stRow).join(""), done.length) +
    archiveHtml("standing", "Notionの記録") + '<span class="status" id="gov-msg"></span>';
  function stRow(x){ const st = standingStatus(x);
      return '<button type="button" class="item" data-open-st="' + esc(x.id) + '"><span>' + esc(x.title) +
        (x.summary ? '<br><span style="font-size:.8rem">' + esc(x.summary.length > 60 ? x.summary.slice(0, 60) + "…" : x.summary) + "</span>" : "") +
        '<br><span style="font-size:.76rem;color:var(--sub)">' + esc(x.created) + ((x.orders || []).length ? "　実行 " + x.orders.filter(o => o.done).length + "/" + x.orders.length : "") +
        '</span></span><span class="st ' + stClass(st) + '">' + st + "</span></button>"; }
}

// 可決した改憲案を憲法に当てはめ、新しい版にする
function adopt(a){
  const c = gov.cons; if (!c) return;
  const ids = [];
  for (const ch of a.changes || []) {
    const art = c.articles.find(x => x.id === ch.articleId);
    if (art) { art.text = ch.newText; ids.push(art.id); }
  }
  c.version += 1;
  c.history = (c.history || []).concat([{ version: c.version, date: taskDay(), note: a.title + " — " + (a.reason || ""), amendment: a.id, articles: ids }]);
}

function bindGov(){
  const box = document.getElementById("gov");
  box.addEventListener("click", async e => {
    const q = sel => e.target.closest(sel);
    let b;
    if (q("[data-gback]")) { gov.view = null; gov.open = null; gov.draft = null; return renderGov(); }
    if ((b = q("[data-gview]"))) { gov.view = b.dataset.gview; gov.open = null; return renderGov(); }
    if (q("[data-sclose]")) { gov.open = null; return renderGov(); }
    // 憲政院:起草
    if (q("[data-new-amend]")) { gov.draft = { id: uid(), created: taskDay(), title: "", reason: "", changes: [{ articleId: gov.cons.articles[0].id, newText: gov.cons.articles[0].text }], submitted: false }; return renderGov(); }
    if ((b = q("[data-open-amend]"))) { const a = gov.amend.items.find(x => x.id === b.dataset.openAmend); gov.draft = JSON.parse(JSON.stringify(a)); return renderGov(); }
    if (q("[data-draft-close]")) { gov.draft = null; return renderGov(); }
    const d = gov.draft;
    if (d && q("[data-ch-add]")) { readDraft(d); d.changes.push({ articleId: gov.cons.articles[0].id, newText: gov.cons.articles[0].text }); return renderGov(); }
    if (d && (b = q("[data-ch-del]"))) { readDraft(d); d.changes.splice(+b.dataset.chDel, 1); return renderGov(); }
    if (d && (q("[data-draft-save]") || q("[data-draft-submit]"))) {
      readDraft(d);
      const submit = !!q("[data-draft-submit]");
      if (submit) {
        const earliest = addDays(d.created, COOLING_DAYS);
        if (!d.title) return govMsg("題名を入れてください。", true);
        if (!d.reason) return govMsg("改正の理由を書いてください。", true);
        if (!d.changes.length) return govMsg("変える条文を1つ以上入れてください。", true);
        if (!d.periodStart || d.periodStart < earliest) return govMsg("審議期間は " + earliest + " 以降にしてください(起草した日から2日あける)。", true);
        if (!d.periodEnd || d.periodEnd < d.periodStart) return govMsg("審議期間の終わりは始めより後にしてください。", true);
        d.submitted = true; d.submittedAt = nowIso();
        // 提出の時点の条文を控える(審議では、この文と新しい文を比べる)
        d.changes.forEach(c => { const art = gov.cons.articles.find(x => x.id === c.articleId); c.oldText = art ? art.text : ""; });
      }
      const ok = await saveGov("amend", () => putAmend(d));
      if (ok) { govMsg(submit ? "提出しました。審議期間まで変えられません。" : "下書きを保存しました"); if (submit) gov.draft = null; renderGov(); }
      return;
    }
    // 最高評議会
    if ((b = q("[data-open-amend-s]"))) { gov.open = { kind: "amend", id: b.dataset.openAmendS }; return renderGov(); }
    if ((b = q("[data-open-pol]"))) { gov.open = { kind: "policy", id: b.dataset.openPol }; return renderGov(); }
    if (q("[data-pol-new]")) {
      const t = (document.getElementById("pol-title").value || "").trim(); if (!t) return;
      await saveGov("council", () => { gov.council.supreme.push({ id: uid(), title: t, created: taskDay() }); });
      return renderGov();
    }
    const target = gov.open && (gov.open.kind === "amend" ? gov.amend.items.find(x => x.id === gov.open.id) : gov.open.kind === "policy" ? gov.council.supreme.find(x => x.id === gov.open.id) : null);
    if (target && q("[data-ss-start]")) {
      const limit = +document.getElementById("ss-limit").value;
      const isAmend = gov.open.kind === "amend";
      if (isAmend && amendStatus(target) !== "審議できる") return govMsg("審議期間の中でだけ審議できます。", true);
      const start = nowIso(), ends = new Date(Date.parse(start) + limit * 60000).toISOString();
      await saveGov(isAmend ? "amend" : "council", () => {
        const t = isAmend ? gov.amend.items.find(x => x.id === target.id) : gov.council.supreme.find(x => x.id === target.id);
        const sess = isAmend ? (t.session = t.session || {}) : t;
        if (sess.startedAt) return false;
        sess.startedAt = start; sess.endsAt = ends; sess.limitMin = limit;
      });
      return renderGov();
    }
    if (target && (q("[data-ss-save]") || q("[data-ss-close]"))) {
      const close = !!q("[data-ss-close]");
      const sess = target.session || {};
      const over = timeLeft(sess) <= 0;
      const pro = over ? sess.pro : (document.getElementById("ss-pro") || {}).value;
      const con = over ? sess.con : (document.getElementById("ss-con") || {}).value;
      const dec = (document.querySelector('input[name="ss-dec"]:checked') || {}).value;
      if (close) {
        if (!(pro || "").trim() || !(con || "").trim()) return govMsg("賛成の理由と反対の理由の両方を書いてから議決してください。", true);
        if (!dec) return govMsg("可決か否決かを選んでください。", true);
      }
      const ok = await saveGov("amend", () => {
        const t = gov.amend.items.find(x => x.id === target.id);
        if (!t.session || t.session.closedAt) return false;            // 確定した議決は変えない
        if (timeLeft(t.session) > 0) { t.session.pro = pro; t.session.con = con; }
        if (close) { t.session.decision = dec; t.session.closedAt = nowIso(); }
      });
      if (ok && close && dec === "可決") {
        await saveGov("cons", () => { adopt(gov.amend.items.find(x => x.id === target.id)); });
        govMsg("可決しました。憲法は第" + gov.cons.version + "版になりました。");
      } else if (ok) govMsg(close ? "否決しました。" : "保存しました");
      return renderGov();
    }
    if (target && (q("[data-ps-save]") || q("[data-ps-close]"))) {
      const close = !!q("[data-ps-close]");
      const notes = (document.getElementById("ps-notes") || {}).value, dec = ((document.getElementById("ps-dec") || {}).value || "").trim();
      if (close && !dec) return govMsg("議決(決めたこと)を書いてください。", true);
      await saveGov("council", () => {
        const t = gov.council.supreme.find(x => x.id === target.id);
        if (!t || t.closedAt) return false;
        if (timeLeft(t) > 0) t.notes = notes;
        t.decision = dec;
        if (close) t.closedAt = nowIso();
      });
      return renderGov();
    }
    // 議題候補
    if (q("[data-cd-quick]") || q("[data-cd-add]")) {
      const quick = !!q("[data-cd-quick]");
      const t = ((document.getElementById(quick ? "cd-quick" : "cd-title") || {}).value || "").trim();
      const tag = (document.getElementById(quick ? "cd-quick-tag" : "cd-tag") || {}).value || "";
      if (!t) return;
      await saveGov("council", () => { gov.council.candidates = (gov.council.candidates || []).concat([{ id: uid(), title: t, tag, note: "", created: taskDay(), status: "候補", star: false }]); });
      govMsg("溜めました");
      return renderGov();
    }
    const cdNote = () => { document.querySelectorAll("[data-cd-note]").forEach(el => { const c = (gov.council.candidates || []).find(x => x.id === el.dataset.cdNote); if (c) c.note = el.value; }); };
    if ((b = q("[data-cd-star]"))) { const id = b.dataset.cdStar; await saveGov("council", () => { cdNote(); const c = gov.council.candidates.find(x => x.id === id); c.star = !c.star; }); return renderGov(); }
    if ((b = q("[data-cd-skip]"))) { const id = b.dataset.cdSkip; await saveGov("council", () => { cdNote(); const c = gov.council.candidates.find(x => x.id === id); c.status = "見送り"; c.closedAt = taskDay(); }); return renderGov(); }
    if ((b = q("[data-cd-back]"))) { const id = b.dataset.cdBack; await saveGov("council", () => { const c = gov.council.candidates.find(x => x.id === id); c.status = "候補"; delete c.closedAt; }); return renderGov(); }
    if ((b = q("[data-cd-del]"))) {
      const id = b.dataset.cdDel, c = (gov.council.candidates || []).find(x => x.id === id);
      if (!c || !confirm("候補「" + c.title + "」を消しますか。")) return;
      await saveGov("council", () => { gov.council.candidates = gov.council.candidates.filter(x => x.id !== id); }); return renderGov();
    }
    if ((b = q("[data-cd-to]"))) {
      const id = b.dataset.cd, to = b.dataset.cdTo, nid = uid();
      await saveGov("council", () => {
        cdNote();
        const c = gov.council.candidates.find(x => x.id === id); if (!c || c.status !== "候補") return false;
        if (to === "常任評議会") gov.council.standing.push({ id: nid, title: c.title, created: taskDay(), status: "未審議", summary: c.note || "", discussion: "", decision: "", orders: [], sessions: [], fromCandidate: c.id });
        else gov.council.supreme.push({ id: nid, title: c.title, created: taskDay(), notes: c.note || "", fromCandidate: c.id });
        c.status = "議題にした"; c.promotedTo = to; c.closedAt = taskDay();
      });
      govMsg(to + "の議題にしました");
      return renderGov();
    }
    // 常任評議会
    if (q("[data-st-new]")) {
      const t = (document.getElementById("st-title").value || "").trim(); if (!t) return;
      const id = uid();
      await saveGov("council", () => { gov.council.standing.push({ id, title: t, created: taskDay(), status: "未審議", summary: "", discussion: "", decision: "", orders: [], sessions: [] }); });
      govMsg("議題を立てました。審議は後でもできます。");
      return renderGov();
    }
    if ((b = q("[data-open-st]"))) { gov.open = { kind: "standing", id: b.dataset.openSt }; return renderGov(); }
    const st = gov.open && gov.open.kind === "standing" ? gov.open.id : null;
    const find = () => gov.council.standing.find(x => x.id === st);
    // 書いている途中のものを拾う(止まっている欄は拾わない)
    const readSt = it => {
      const sum = document.getElementById("st-sum"), disc = document.getElementById("st-disc"), dec = document.getElementById("st-dec");
      if (sum && !sum.disabled) it.summary = sum.value;
      if (disc && !disc.disabled) it.discussion = disc.value;
      if (dec && !dec.disabled) it.decision = dec.value;
    };
    if (st && q("[data-st-start]")) {
      const limit = +document.getElementById("st-limit").value, start = nowIso();
      await saveGov("council", () => { const it = find(); if (!it || liveSession(it)) return false; readSt(it);
        it.sessions = (it.sessions || []).concat([{ startedAt: start, endsAt: new Date(Date.parse(start) + limit * 60000).toISOString(), limitMin: limit }]);
        it.status = "審議中"; });
      return renderGov();
    }
    if (st && (b = q("[data-st-ext]"))) {
      const add = +b.dataset.stExt;
      await saveGov("council", () => { const it = find(), l = it && liveSession(it); if (!l) return false;
        const base = Math.max(Date.parse(l.endsAt), Date.parse(nowIso()));      // 時間切れのあとなら、今から延ばす
        l.endsAt = new Date(base + add * 60000).toISOString(); l.extended = (l.extended || 0) + add; });
      govMsg(add + "分延長しました");
      return renderGov();
    }
    if (st && q("[data-st-pause]")) {
      await saveGov("council", () => { const it = find(), l = it && liveSession(it); if (!l) return false; readSt(it);
        const now = nowIso(); l.closedAt = Date.parse(now) < Date.parse(l.endsAt) ? now : l.endsAt; });
      govMsg("区切りました。続きはいつでも再開できます。");
      return renderGov();
    }
    if (st && q("[data-st-decide]")) {
      const dec = (document.getElementById("st-dec").value || "").trim();
      if (!dec) return govMsg("決定を書いてから議決してください。", true);
      await saveGov("council", () => { const it = find(); if (!it) return false; readSt(it);
        const l = liveSession(it); if (l) { const now = nowIso(); l.closedAt = Date.parse(now) < Date.parse(l.endsAt) ? now : l.endsAt; }
        it.decision = dec; it.decidedAt = nowIso(); it.status = "議決"; });
      govMsg("議決しました。決めたことの実行を下に足せます。");
      return renderGov();
    }
    if (st && q("[data-st-reopen]")) {
      await saveGov("council", () => { const it = find(); if (!it) return false; delete it.decidedAt; it.status = "審議中"; });
      return renderGov();
    }
    if (st && q("[data-st-done]")) {
      await saveGov("council", () => { const it = find(); if (!it) return false; it.status = "実施済み"; });
      return renderGov();
    }
    if (st && q("[data-st-remove]")) {
      const it = find(); if (!it) return;
      if (!confirm("議題「" + it.title + "」を消しますか。議論と決定も消えます。")) return;
      await saveGov("council", () => { gov.council.standing = gov.council.standing.filter(x => x.id !== st); });
      gov.open = null; govMsg("消しました"); renderOrders();
      return renderGov();
    }
    if (st && q("[data-st-add]")) {
      const t = (document.getElementById("st-new").value || "").trim(); if (!t) return;
      await saveGov("council", () => { const it = find(); readSt(it); it.orders = (it.orders || []).concat([{ id: uid(), text: t, done: false }]); if (it.status === "実施済み") it.status = "議決"; });
      return renderGov();
    }
    if (st && (b = q("[data-st-del]"))) { await saveGov("council", () => { const it = find(); it.orders = it.orders.filter(o => o.id !== b.dataset.stDel); }); return renderGov(); }
    if (st && q("[data-st-save]")) { const ok = await saveGov("council", () => readSt(find())); if (ok) govMsg("保存しました"); return; }
  });
  box.addEventListener("change", async e => {
    const c = e.target.closest("[data-st-check]"); if (!c) return;
    const st = gov.open && gov.open.id, on = c.checked;
    await saveGov("council", () => { const it = gov.council.standing.find(x => x.id === st); const o = it.orders.find(x => x.id === c.dataset.stCheck); o.done = on; o.doneAt = on ? taskDay() : null;
      if (!on && it.status === "実施済み") it.status = it.decidedAt ? "議決" : "審議中"; });
    renderGov(); renderOrders();
  });
}

async function saveStaff(mutate, msgId){
  for (let i = 0; i < 3; i++) {
    try { if (mutate(staff.doc) === false) return false; staff.sha = await writeJson(STAFF, staff.doc, staff.sha); return true; }
    catch (e) {
      if ((e.status === 409 || e.status === 422) && i < 2) { await loadStaff(); continue; }
      const el = document.getElementById(msgId || "sf-msg"); if (el) { el.textContent = e.message; el.classList.add("err"); } return false;
    }
  }

}
const sfMsg = (t, err) => { const el = document.getElementById("sf-msg"); if (el) { el.textContent = t; el.classList.toggle("err", !!err); } };
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
function currentTerm(){ const d = taskDay(); return staff.doc.terms.find(t => t.issuedAt && !t.closedAt && t.start <= d && d <= t.end) || staff.doc.terms.find(t => t.issuedAt && !t.closedAt) || null; }
// 線:期の始めから期日まで、まっすぐ目標の値へ
function goalLine(term, g){
  const d = taskDay(), total = Math.max(1, daysBetween(term.start, g.due)), el = Math.max(0, Math.min(total, daysBetween(term.start, d)));
  const expect = (+g.target || 0) * el / total;
  const vals = g.values || [], actual = vals.length ? +vals[vals.length - 1].value : 0;
  const behind = el >= 3 && expect > 0 && actual < expect * (1 - BEHIND);
  return { expect, actual, behind, frac: Math.min(1, actual / Math.max(1e-9, +g.target || 1)), efrac: Math.min(1, expect / Math.max(1e-9, +g.target || 1)) };
}

const KEY_DRAFT = "sho-term-draft";
function saveDraft(){ try { if (staff.draft) localStorage.setItem(KEY_DRAFT, JSON.stringify(staff.draft)); else localStorage.removeItem(KEY_DRAFT); } catch (e) {} }
function situation(){
  const ms = (state.gov && state.gov.ministries) || [], prev = staff.doc.terms.filter(t => t.closedAt).slice(-1)[0];
  const hist = (state.stats && state.stats.power_history) || [], from = prev ? prev.start : addDays(taskDay(), -30);
  const span = hist.filter(r => r.date >= from), R = r => r.real != null ? r.real : r.power;
  const power = span.length ? { from: span[0].date, to: span[span.length - 1].date, a: R(span[0]), b: R(span[span.length - 1]) } : null;
  const rows = ms.map(m => {
    const p = powerOf(m.tag) || {}, ts = state.tasks.filter(t => (t.def.ministries || []).includes(m.tag) && !["アーカイブ", "達成済み"].includes(t.status));
    const tEs = tide.doc.entries.filter(e => !e.deleted && e.type !== "cancel" && shareOf(e, m.tag) > 0);
    return { tag: m.tag, name: m.name, weight: p.weight != null ? +p.weight : null, territory: p.territory, dominance: p.dominance,
      tide: net(sumParts(tEs.map(e => scaleParts(tideAt(e, taskDay()), shareOf(e, m.tag))))), burden: tEs.filter(e => e.type === "plus").reduce((a, e) => a + (e.burden || 0) * remainRatio(e) * shareOf(e, m.tag), 0),
      fallen: ts.filter(t => t.status === "要再設定").length, waiting: ts.filter(t => t.waiting).length, tasks: ts.length };
  });
  const alerts = pages().filter(p => p.kind === "ALERT" && ["発生", "対応中"].includes(p.status));
  const raids = defenseTag() ? raidCandidates() : [];
  const cands = ((gov.council && gov.council.candidates) || []).filter(c => !c.status || c.status === "候補").slice(0, 6);
  return { prev, power, rows, alerts, raids, cands };
}

      S.rows.map(r => '<div class="mtr"><span style="color:' + colorOf(r.tag) + ';font-weight:700">' + esc(r.name) + "</span><span>" + f1(r.weight) + "</span><span>" + (r.territory != null ? esc(r.territory) + "・" + Math.round(r.dominance || 0) : "—") + "</span><span>" +

function parseDelim(text, sep){

    if (ch === '"' && cell === "") { q = true; continue; }
    if (ch === sep) { row.push(cell); cell = ""; continue; }
    if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; continue; }
    cell += ch;

    const cols = (j.cols || []).map(c => typeof c === "string" ? { name: c, type: "text" } : Object.assign({ type: "text" }, c));
    return { cols, rows: (j.rows || []).map(r => cols.map((c, i) => Array.isArray(r) ? clean(r[i]) : clean((r || {})[c.name]))) };
  }

const daysLeft = p => p.due ? Math.round((Date.parse(p.due) - Date.parse(taskDay())) / 864e5) : null;

/* ───────── RAID(防衛省の主体的な侵攻:止まった省を再始動できる状態に戻す) ───────── */
const RST = ["計画中", "侵攻中", "制圧", "引き渡し済み"];
const raidActive = p => ["計画中", "侵攻中"].includes(p.status);
// 侵攻の候補:要再設定のタスクが多い省・長く何も済ませていない省
function raidCandidates(){
  const dt = defenseTag(), ms = ((state.gov && state.gov.ministries) || []).filter(m => m.tag !== dt);
  const busy = new Set(pages().filter(p => isRaid(p) && raidActive(p)).flatMap(p => targetsOf(p)));
  const ts0 = state.tideState || {}, cred = ts0.credibility || {}, counted = ts0.counted || {};
  return ms.map(m => {
    const ts = state.tasks.filter(t => (t.def.ministries || []).includes(m.tag) && !["アーカイブ", "達成済み", "休止中"].includes(t.status));
    // 時勢と行動のずれ:気持ちを書いても計画が動かず、信用が記録の無いときの値(1/2)を下回った
    const gap = counted[m.tag] > 0 && cred[m.tag] != null && cred[m.tag] < 0.5 ? cred[m.tag] : null;
    if (!ts.length && gap == null) return null;
    const fall = ts.filter(t => t.status === "要再設定").length;
    const last = ts.map(t => t.lastDone).filter(Boolean).sort().pop() || null;
    const idle = last ? Math.round((Date.parse(taskDay()) - Date.parse(last)) / 864e5) : null;
    const score = (ts.length ? fall / ts.length + (idle == null ? 1 : Math.min(1, idle / 14)) : 0) + (gap != null ? 0.5 - gap : 0);
    const stuck = ts.length && (fall >= 3 || fall / ts.length >= 0.5 || (idle != null && idle >= 7));
    if (!stuck && gap == null) return null;
    return { m, fall, all: ts.length, idle, score, busy: busy.has(m.tag), gap, stuck };
  }).filter(Boolean).sort((a, b) => b.score - a.score);
}
const candWhy = c => [c.stuck ? "要再設定 " + c.fall + "/" + c.all + (c.idle != null ? "・" + c.idle + "日済ませていない" : "・まだ一度も済ませていない") : "", c.gap != null ? "時勢と行動のずれ(信用 " + c.gap.toFixed(2) + ")" : ""].filter(Boolean).join("・");
// RAID・ALERTの対象の省(複数)。前の形(target が1つ)もそのまま読む
function targetsOf(p){ const a = Array.isArray(p.targets) ? p.targets : []; return a.length ? a : (p.target ? [p.target] : []); }
function targetNames(p){ const ms = (state.gov && state.gov.ministries) || []; return targetsOf(p).map(t => (ms.find(m => m.tag === t) || { name: t }).name); }
function targetChips(id, p){ const ms = ((state.gov && state.gov.ministries) || []).filter(m => m.tag !== defenseTag()), cur = targetsOf(p);
  return '<div class="chips" id="' + id + '">' + ms.map(m => '<label class="chip"><input type="checkbox" data-tg-pick value="' + esc(m.tag) + '"' + (cur.includes(m.tag) ? " checked" : "") + "> " + esc(m.name) + "</label>").join("") + "</div>"; }
const pickedTargets = id => Array.from(document.querySelectorAll("#" + id + " [data-tg-pick]:checked")).map(z => z.value);
function raidCard(p){
  const ms = (state.gov && state.gov.ministries) || [], acts = (p.actions || []).filter(a => !a.rev), d = acts.filter(actDone).length;
  return '<div class="rcard raid-card' + (raidActive(p) ? "" : " closed") + (p.status === "失敗" ? " failed" : "") + '"><a href="#" data-goto-page="' + p.id + '" class="rc-main"><span class="rc-lab">' + esc(p.label) + '</span><span class="rc-tt">' + esc(p.title || (targetNames(p).join("・") ? targetNames(p).join("・") + "の再始動" : "")) + "</span></a>" +
    '<div class="rc-meta"><span class="ast">' + esc(p.status) + "</span>" + (targetsOf(p).length ? "<span>対象 " + esc(targetNames(p).join("・")) + "</span>" : "") +
    (acts.length ? '<span class="gauge"><span class="gbar"><i style="width:' + (d / acts.length * 100) + '%"></i></span><b>' + d + "/" + acts.length + "</b>作戦</span>" : "") + "</div></div>";
}

    box.innerHTML = h; return;
  }
  h += '<div class="pg-head"><span class="pk pk-RAID">' + esc(p.label) + "</span>" + (p.title ? "<h2>" + esc(p.title) + "</h2>" : '<h2><button type="button" class="linkbtn big" data-page-edit>名前を付ける</button></h2>') +
    '<button type="button" class="btn ghost sm" data-page-edit>直す</button></div>' +

    rules = appRules || [];
    document.addEventListener("click", e => { const s = e.target && e.target.closest ? soundFor(e.target) : null; if (s) play(s); }, true);
    // エラーの表示(class="err")が出たら、低い音
    try {
      new MutationObserver(ms => { for (const m of ms) { const el = m.target.nodeType === 1 ? m.target : m.target.parentElement; if (!el || !el.closest) continue;
        const er = el.closest(".err"); if (er && (er.textContent || "").trim()) { play("error"); break; } } })
        .observe(document.body, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ["class"] });
    } catch (e) {}
  }
  // 設定の欄(入/切・音量)。アプリの版の表示のそばに置く
  function mount(anchor){
    if (!anchor || document.getElementById("se-row")) return;
    const row = document.createElement("div"); row.id = "se-row"; row.className = "se-row";
    row.innerHTML = '<span>効果音</span><button type="button" id="se-on" class="se-btn"></button><label class="se-vol">音量 <input id="se-vol" type="range" min="0" max="1" step="0.05"></label>';
    anchor.parentNode.insertBefore(row, anchor.nextSibling);
    const b = row.querySelector("#se-on"), r = row.querySelector("#se-vol");
    const show = () => { b.textContent = on ? "入" : "切"; b.setAttribute("aria-pressed", String(on)); r.value = vol; r.disabled = !on; };
    b.addEventListener("click", () => { on = !on; try { localStorage.setItem("se-on", on ? "1" : "0"); } catch (e) {} show(); if (on) play("toggleOn"); });
    r.addEventListener("input", () => { vol = +r.value; try { localStorage.setItem("se-vol", String(vol)); } catch (e) {} });
    r.addEventListener("change", () => play("done"));
    show();
  }
  return { play, init, mount, soundFor, get on(){ return on; } };
})();

  ["[data-dpick]", el => el.getAttribute("aria-pressed") === "true" ? "toggleOff" : "toggleOn"],
  ["[data-tdel], [data-del], [data-page-del], [data-act-del], [data-cond-del], [data-tide-del], [data-tcol-del], [data-trow-del], [data-g-del], [data-issue-del], [data-cd-del], [data-st-del], [data-box-del], [data-ch-del], [data-tunlink], [data-min-del]", "remove"],
  ["[data-act-task]", "send"],
  ["[data-tsplit-do]", "levelup"], ["[data-tmerge]", "down"],
  ["[data-fail-save]", "down"],
  ["[data-task-add], [data-page-save], [data-act-add], [data-cond-add], [data-save], [data-sl-save], [data-pp-save], [data-min-save], [data-review-save], [data-review-send], [data-term-edit-save], [data-act-save], [data-raid-prog], [data-raid-revise-save], [data-tren-save], [data-ss-save], [data-ps-save], [data-st-save], [data-draft-save], [data-gval], [data-raid-handover], [data-focus-change], [data-close-term]", "save"],
  ["[data-open], [data-goto-page], [data-goto-tide], #connect, #reload", "open"],
  ["[data-mtab], [data-stab], [data-lv], [data-view], nav button", "tab"]
]);
(function(){ const go = () => { const a = document.getElementById("ver"); SE.mount(a ? (a.closest("p, div, .f, .row") || a) : null); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", go); else go(); })();
