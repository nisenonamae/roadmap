<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>行軍表</title>
<meta name="theme-color" content="#1D2430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="行軍表">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon-192.png">
<script src="./engine.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F0;
  --sheet:#F8FAF9;
  --ink:#1D2430;
  --sub:#5F6873;
  --rule:#CDD3D6;
  --reach:#B3283C;
  --focus:#2F5DA8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.wrap{max-width:640px;margin:0 auto;padding:1.1rem 1rem 2rem}

/* 見出し */
.head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  padding-bottom:.7rem;border-bottom:2px solid var(--ink);margin-bottom:.9rem}
.head h1{margin:0;font-size:1.35rem;font-weight:700;letter-spacing:.08em}
.head .date{font-variant-numeric:tabular-nums;color:var(--sub);font-size:.88rem;text-align:right}
.notice{background:var(--sheet);border-left:3px solid var(--sub);padding:.55rem .75rem;
  font-size:.86rem;color:var(--sub);margin:0 0 .9rem}
.notice.warn{border-left-color:var(--reach);color:var(--ink)}

/* 枠 */
.block{margin-bottom:1.4rem}
.block-head{display:flex;align-items:baseline;justify-content:space-between;
  padding:.2rem 0 .45rem;border-bottom:1px solid var(--rule)}
.block-head h2{margin:0;font-size:1.05rem;font-weight:700;letter-spacing:.1em}
.block-head .span{font-variant-numeric:tabular-nums;color:var(--sub);font-size:.84rem}
.block-head .over{color:var(--reach);font-weight:700}

/* 時刻表の行。左に時刻、真ん中に路線の線、右に中身 */
.stop{display:grid;grid-template-columns:3.4rem 14px 1fr;column-gap:.6rem;align-items:stretch}
.stop .t{font-variant-numeric:tabular-nums;font-weight:700;font-size:.95rem;padding-top:.55rem;text-align:right}
.stop .line{position:relative}
.stop .line::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:4px;background:var(--c,#8A929C)}
.stop .line::after{content:"";position:absolute;left:1px;top:.75rem;width:12px;height:12px;
  border-radius:50%;background:var(--sheet);border:3px solid var(--c,#8A929C);box-sizing:border-box}
.stop .body{padding:.45rem 0 .7rem;min-width:0}
.stop .name{font-weight:700;font-size:1rem;line-height:1.45;word-break:break-word}
.stop .meta{display:flex;flex-wrap:wrap;gap:.35rem .7rem;font-size:.8rem;color:var(--sub);margin-top:.15rem}
.stop .meta .pl{color:var(--c)}
.stop .meta .reach{color:var(--reach);font-weight:700}
.stop .meta .unset{color:var(--sub);text-decoration:underline dotted}
.stop .nagara{margin-top:.35rem;padding-left:.7rem;border-left:2px dotted var(--rule);font-size:.88rem}
.stop .nagara div{line-height:1.5}
.stop .nagara span{color:var(--sub);font-size:.78rem;margin-left:.4rem}
.stop.done{opacity:.62}
.stop.done .name{text-decoration:line-through;text-decoration-thickness:1px;color:var(--sub)}
.stop.done .t{color:var(--sub);font-size:.8rem;letter-spacing:.1em}
.stop.done .line::after{background:var(--c);border-color:var(--c)}
.stop.pending .tick{background:#3D8A5A;border-color:#3D8A5A;color:#fff}
.stop.pending .name{text-decoration:line-through;color:var(--sub)}
@keyframes flashrow{0%{background:#FFF1B8}100%{background:transparent}}
.flash{animation:flashrow 2.4s ease-out}
.done-list li{align-items:center}
.done-list .dn{text-decoration:line-through;color:var(--sub)}
.done-list button{border:1px solid var(--rule);background:#fff;border-radius:3px;padding:.2rem .7rem;cursor:pointer;font-size:.82rem;color:var(--ink)}
.stop .row-in{display:flex;gap:.6rem;align-items:flex-start}
.stop .row-in .txt{flex:1;min-width:0}
.stop .tick{flex:0 0 auto;width:2.4rem;height:2.4rem;margin-top:.1rem;border-radius:50%;border:2px solid var(--rule);
  background:var(--sheet);font-size:1rem;color:var(--sub);cursor:pointer}
.stop .tick.on{background:#3D8A5A;border-color:#3D8A5A;color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:20;
  background:var(--ink);color:#fff;border-radius:6px;padding:.6rem .8rem;display:flex;gap:.9rem;align-items:center;
  font-size:.88rem;max-width:calc(100% - 2rem);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.toast[hidden]{display:none}
.toast button{border:none;background:none;color:#9FD4B3;font:inherit;font-weight:700;cursor:pointer;padding:0;white-space:nowrap}

/* 乗り換え */
.transfer{display:grid;grid-template-columns:3.4rem 14px 1fr;column-gap:.6rem;
  font-size:.78rem;color:var(--sub)}
.transfer .line{position:relative}
.transfer .line::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:4px;
  background:repeating-linear-gradient(var(--rule) 0 3px,transparent 3px 6px)}
.transfer.chain .line::before{background:var(--c,#8A929C);opacity:.45}
.transfer.chain .txt{color:var(--ink);opacity:.6}
.transfer .txt{padding:.15rem 0}

/* その他の一覧 */
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:1rem;padding:.45rem 0;border-bottom:1px solid var(--rule)}
.list li:last-child{border-bottom:none}
.list .r{color:var(--sub);font-size:.82rem;white-space:nowrap;font-variant-numeric:tabular-nums}
details.more{margin-top:1rem}
details.more summary{cursor:pointer;color:var(--sub);font-size:.88rem;padding:.3rem 0}
.empty{color:var(--sub);font-size:.9rem;padding:1rem 0}

/* 用事 */
.evp{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:.7rem .8rem;margin:0 0 1.1rem}
.evp-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.45rem}
.evp-h h2{margin:0;font-size:.98rem;letter-spacing:.08em}
.evp-h span{font-size:.78rem;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chips button{border:1px solid var(--rule);background:#fff;border-radius:3px;padding:.3rem .7rem;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips button.new{border-style:dashed;color:var(--sub)}
.ev-list{list-style:none;margin:.6rem 0 0;padding:0}
.ev-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.3rem .6rem;padding:.45rem 0;border-top:1px solid var(--rule);align-items:center}
.ev-list .en{font-weight:700;word-break:break-word}
.ev-list .en small{font-weight:400;color:var(--sub);margin-left:.4rem}
.ev-list .times{display:flex;align-items:center;gap:.3rem;grid-column:1/2}
.ev-list .times input{width:6.2rem;padding:.2rem .3rem;border:1px solid var(--rule);border-radius:3px;background:#fff}
.ev-list .del{grid-row:1/3;grid-column:2;border:1px solid var(--rule);background:#fff;border-radius:3px;padding:.3rem .6rem;cursor:pointer;color:var(--sub)}
.ev-form{margin-top:.6rem;padding-top:.6rem;border-top:1px dashed var(--rule)}
.ev-form[hidden]{display:none}
.ev-form .row{display:flex;gap:.6rem;align-items:center;margin-top:.55rem;flex-wrap:wrap}
.stop.ev .line::before{width:8px;left:3px}
.stop.ev .line::after{border-radius:2px;background:var(--c);top:.7rem}
.stop.ev .span-t{font-size:.8rem;color:var(--sub);font-variant-numeric:tabular-nums}
.days{display:flex;gap:.25rem;flex-wrap:wrap;margin-top:.45rem}
.days button{border:1px solid var(--rule);background:#fff;border-radius:3px;width:2.1rem;padding:.2rem 0;cursor:pointer}
.days button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* 計画 */
.zoom{display:flex;gap:.3rem;margin:0 0 .6rem}
.zoom button{border:1px solid var(--rule);background:#fff;border-radius:3px;padding:.25rem .75rem;cursor:pointer}
.zoom button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tl-wrap{overflow-x:auto;border:1px solid var(--rule);background:var(--sheet);border-radius:4px;-webkit-overflow-scrolling:touch}
.tl-row{display:flex;border-bottom:1px solid var(--rule);min-width:max-content}
.tl-row:last-child{border-bottom:none}
.tl-label{position:sticky;left:0;z-index:3;flex:0 0 4.4rem;width:4.4rem;background:var(--sheet);
  padding:.4rem .45rem;font-size:.78rem;font-weight:700;border-right:1px solid var(--rule);line-height:1.3;word-break:break-all}
.tl-track{position:relative;flex:0 0 auto}
.tl-head .tl-track{height:2.1rem}
.tl-mon{position:absolute;top:0;height:100%;border-left:1px solid var(--rule);font-size:.72rem;color:var(--sub);padding:.15rem .3rem;white-space:nowrap}
.tl-wk{position:absolute;bottom:0;font-size:.66rem;color:var(--sub);transform:translateX(-50%)}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--reach);opacity:.55;z-index:1;pointer-events:none}
.tl-it{position:absolute;height:22px;border:none;border-radius:3px;font:inherit;font-size:.72rem;line-height:22px;
  padding:0 .4rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-align:left;z-index:2;color:var(--ink)}
.tl-it.period{background:transparent;border:1.5px solid var(--c);line-height:19px;font-weight:700}
.tl-it.period.active{background:color-mix(in srgb,var(--c) 10%,transparent)}
.tl-it.campaign{background:var(--c);color:#fff}
.tl-it.campaign.drift{outline:2px dashed var(--reach);outline-offset:1px}
.tl-it.buffer{background:repeating-linear-gradient(135deg,var(--rule) 0 4px,transparent 4px 8px);color:var(--sub);border:1px solid var(--rule)}
.tl-it.buffer.clash{border-color:var(--reach)}
.tl-mk{position:absolute;height:22px;display:flex;align-items:center;gap:.3rem;border:none;background:none;
  font:inherit;font-size:.7rem;color:var(--ink);cursor:pointer;padding:0;z-index:2;white-space:nowrap;max-width:9rem;overflow:hidden}
.tl-mk .dm{flex:0 0 12px;width:12px;height:12px;transform:rotate(45deg);background:var(--sheet);border:2px solid var(--c)}
.tl-mk.achieved .dm{background:#3D8A5A;border-color:#3D8A5A}
.tl-mk.missed .dm{background:var(--reach);border-color:var(--reach)}
.tl-mk.behind .dm{border-color:#B07D2A;background:#F4E6C8}
.tl-mk .sq{flex:0 0 12px;width:12px;height:12px;background:var(--c);border-radius:2px}
.tl-mk.created .sq{background:#3D8A5A}
.tl-mk span.l{overflow:hidden;text-overflow:ellipsis}
.tl-empty{padding:1.2rem .9rem;color:var(--sub);font-size:.9rem}
.add-row{display:flex;flex-wrap:wrap;gap:.35rem;margin:.8rem 0}
.add-row button{border:1px dashed var(--sub);background:transparent;border-radius:3px;padding:.3rem .7rem;cursor:pointer;color:var(--ink)}
.pnotice{display:block;width:100%;text-align:left;border:none;border-left:3px solid var(--sub);background:var(--sheet);
  padding:.45rem .7rem;margin:0 0 .35rem;font:inherit;font-size:.85rem;cursor:pointer;color:var(--ink);line-height:1.5}
.pnotice.bad{border-left-color:var(--reach)}
.pnotice.warn{border-left-color:#B07D2A}
.pnotice.good{border-left-color:#3D8A5A}
.peditor{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:.8rem;margin-top:.4rem}
.peditor h2{font-size:1rem;margin:0 0 .6rem}
.peditor .now{font-size:.84rem;color:var(--sub);margin:.1rem 0 .7rem}
.peditor .row{display:flex;gap:.6rem;align-items:center;margin-top:.8rem;flex-wrap:wrap}
details.rules{margin-top:1.4rem;border-top:1px solid var(--rule);padding-top:.5rem}
details.rules summary{cursor:pointer;font-weight:700;padding:.3rem 0;letter-spacing:.06em}
details.rules .rb{font-size:.88rem;line-height:1.75;padding:.2rem 0 .6rem}
details.rules h3{font-size:.92rem;margin:1rem 0 .25rem}
details.rules p{margin:.2rem 0}
details.rules ol,details.rules ul{margin:.2rem 0;padding-left:1.3rem}
details.rules .note{color:var(--sub);font-size:.8rem}

/* タスク */
.tk-sum{display:flex;flex-wrap:wrap;gap:.3rem .9rem;font-size:.84rem;color:var(--sub);margin:0 0 .8rem}
.tk-sum b{color:var(--ink);font-variant-numeric:tabular-nums}
.tk-group{margin-bottom:1.1rem}
.tk-group h2{font-size:.95rem;margin:0 0 .3rem;padding-bottom:.3rem;border-bottom:1px solid var(--rule);
  display:flex;justify-content:space-between;align-items:baseline;letter-spacing:.06em}
.tk-group h2 span{font-size:.78rem;color:var(--sub);font-weight:400}
.tk{display:block;width:100%;text-align:left;border:none;background:none;font:inherit;color:inherit;
  padding:.5rem 0;border-bottom:1px solid var(--rule);cursor:pointer}
.tk:last-child{border-bottom:none}
.tk .tn{font-weight:700;line-height:1.4;word-break:break-word}
.tk .tm{display:flex;flex-wrap:wrap;gap:.2rem .7rem;font-size:.78rem;color:var(--sub);margin-top:.15rem;align-items:center}
.chip{display:inline-block;font-size:.72rem;padding:0 .45rem;border-radius:3px;border:1px solid var(--rule);color:var(--ink);line-height:1.6}
.chip.s-新規{border-color:#B07D2A;color:#8A5F12}
.chip.s-進行中{border-color:#2F5DA8;color:#2F5DA8}
.chip.s-定着{background:#E3EEE6;border-color:#3D8A5A;color:#2E6B45}
.chip.s-熟達{background:#3D8A5A;border-color:#3D8A5A;color:#fff}
.chip.s-要再設定{border-color:var(--reach);color:var(--reach)}
.chip.s-実験,.chip.s-随時{border-style:dashed}
.bar{display:inline-block;width:4.2rem;height:6px;background:var(--rule);border-radius:3px;overflow:hidden;vertical-align:middle}
.bar i{display:block;height:100%;background:#2F5DA8}
.cyc{color:var(--ink)}
.strip{display:flex;gap:2px;margin:.4rem 0 .2rem}
.strip span{flex:1;min-width:0;text-align:center;font-size:.72rem;padding:.2rem 0;border-radius:2px;background:var(--paper)}
.strip span.ok{background:#3D8A5A;color:#fff}
.strip span.ng{background:var(--reach);color:#fff}
.strip span.ex{background:var(--rule);color:var(--sub)}
.strip span.no{background:transparent;color:var(--rule)}
.strip-d{display:flex;gap:2px;font-size:.62rem;color:var(--sub)}
.strip-d span{flex:1;text-align:center}
.tk-detail .nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.5rem,1fr));gap:.3rem .8rem;margin:.6rem 0}
.tk-detail .nums div{font-size:.78rem;color:var(--sub)}
.tk-detail .nums b{display:block;font-size:1.05rem;color:var(--ink);font-variant-numeric:tabular-nums}
.tk-detail h3{font-size:.88rem;margin:1rem 0 .3rem}
.tk-detail textarea{width:100%;min-height:6rem;padding:.4rem .5rem;border:1px solid var(--rule);border-radius:3px;font:inherit;background:#fff}
.tk-detail ul.gens{list-style:none;padding:0;margin:0;font-size:.84rem}
.tk-detail ul.gens li{padding:.25rem 0;border-bottom:1px dashed var(--rule)}

/* 記録 */
.tk-bar{display:flex;flex-wrap:wrap;gap:.5rem .8rem;align-items:center;margin:0 0 .8rem;font-size:.84rem}
.tk-bar select{padding:.25rem .4rem;border:1px solid var(--rule);border-radius:3px;background:#fff;font:inherit}
.rec-list{margin:0 0 1.2rem}
.rec-list h2{font-size:1rem;margin:0 0 .3rem;letter-spacing:.06em}
.rec-slot{font-size:.76rem;color:var(--sub);margin:.6rem 0 .1rem;letter-spacing:.1em}
.rec{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:.5rem;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--rule)}
.rec .rn{font-weight:700;line-height:1.35;word-break:break-word}
.rec .rn small{display:block;font-weight:400;font-size:.76rem;color:var(--sub)}
.rec .q{width:2.6rem;height:2.6rem;border-radius:50%;border:2px solid var(--rule);background:#fff;font-size:1.1rem;cursor:pointer;color:var(--sub)}
.rec .q.on{background:#3D8A5A;border-color:#3D8A5A;color:#fff}
.rec .q.ng{border-color:var(--reach);color:var(--reach)}
.rec .more{border:1px solid var(--rule);background:#fff;border-radius:3px;padding:.35rem .55rem;cursor:pointer;font-size:.8rem}
.opts{display:flex;flex-wrap:wrap;gap:.3rem;margin:.2rem 0 .6rem}
.opts button{border:1px solid var(--rule);background:#fff;border-radius:3px;padding:.3rem .65rem;cursor:pointer;font-size:.85rem}
.opts button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.dur{display:flex;gap:.4rem;align-items:center}
.dur input{width:4.2rem;padding:.35rem .4rem;border:1px solid var(--rule);border-radius:3px}

/* 設定 */
.sec{margin-bottom:1.6rem}
.sec h2{font-size:1rem;margin:0 0 .5rem;letter-spacing:.06em}
.sec p.hint{margin:.1rem 0 .7rem;color:var(--sub);font-size:.84rem}
.task-edit{padding:.75rem 0;border-bottom:1px solid var(--rule)}
.task-edit .tn{font-weight:700;margin-bottom:.45rem;word-break:break-word}
.task-edit .tn small{font-weight:400;color:var(--sub);margin-left:.4rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:.5rem .7rem}
.f label{display:block;font-size:.75rem;color:var(--sub);margin-bottom:.15rem}
.f input,.f select{width:100%;padding:.35rem .45rem;border:1px solid var(--rule);background:#fff;border-radius:3px}
.f input[type="checkbox"]{width:auto;padding:0;margin:0 .3rem 0 0;vertical-align:middle;accent-color:var(--ink)}
.chk{display:flex;flex-wrap:wrap;gap:.35rem .9rem;margin-top:.2rem}
.chk label{display:inline-flex;align-items:center;font-size:.88rem;color:var(--ink);margin:0;white-space:nowrap}
.organs{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.5rem}
.organs button{border:1px solid var(--rule);background:#fff;border-radius:3px;padding:.2rem .65rem;cursor:pointer}
.organs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.blocks-edit .row3{display:grid;grid-template-columns:3rem 1fr 1fr;gap:.5rem;align-items:center;margin-bottom:.4rem}
.savebar{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));background:var(--paper);
  padding:.6rem 0;border-top:1px solid var(--rule);display:flex;align-items:center;gap:.8rem}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:3px;padding:.45rem 1rem;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.status{font-size:.85rem;color:var(--sub)}
.status.err{color:var(--reach)}

/* 下のタブ */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--rule);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:none;background:none;padding:.8rem 0;cursor:pointer;color:var(--sub);font-weight:700;font-size:.86rem;white-space:nowrap;min-width:0}
nav.tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}
.view[hidden]{display:none}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <section class="view" id="view-today">
    <header class="head">
      <h1>行軍表</h1>
      <div class="date" id="date">—</div>
    </header>
    <div id="notices"></div>
    <div id="events-panel"></div>
    <div id="plan"></div>
  </section>

  <section class="view" id="view-plan" hidden>
    <header class="head">
      <h1>計画</h1>
      <div class="date" id="plan-date">—</div>
    </header>
    <div id="plan-notices"></div>
    <div class="zoom" role="group" aria-label="表示の幅" id="zoom">
      <button type="button" data-zoom="週">週</button>
      <button type="button" data-zoom="月">月</button>
      <button type="button" data-zoom="四半期">四半期</button>
      <button type="button" data-zoom="年">年</button>
    </div>
    <div class="tl-wrap" id="tl"></div>
    <div class="add-row" id="plan-add">
      <button type="button" data-add="period">期間を足す</button>
      <button type="button" data-add="campaign">作戦を足す</button>
